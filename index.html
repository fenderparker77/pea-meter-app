    function exportTableToExcel() {
      const table = document.getElementById("detailDataTreeTable");
      if (!table || table.rows.length <= 1) {
        alert("ไม่มีข้อมูลสำหรับ Export");
        return;
      }
      const currentStatusTitle = document.getElementById('tableModalTitle').innerText.replace('รายละเอียดสถานะ: ', '').trim();
      const monthFilter = document.getElementById('filter-month').value;
      const fileName = `รายงานใบงาน_${currentStatusTitle}_เดือน_${monthFilter}.xlsx`;
      
      const wb = XLSX.utils.table_to_book(table, {sheet: "Sheet1"});
      XLSX.writeFile(wb, fileName);
    }

    // =========================================================================
    // 🤖 J.A.R.V.I.S Smart Voice Brain v5.2
    // (Create New Month Sheet with Formulas + Incomplete Audit + Duplicate Sync)
    // =========================================================================
    class JarvisVoiceBrain {
      constructor() {
        this.state = {
          mode: 'IDLE',           // IDLE | AWAITING_CHOICE | AWAITING_FILTER | AWAITING_INTENT
          choices: [],            // [{ label, icon, priority, keywords: [], handler: fn }, ...]
          defaultAllHandler: null,
          lastKeywords: [],
          lastMatchedItems: [],
          duplicateContext: null,
          uncertainQueue: []
        };
        this.STORAGE_KEY = 'jarvis_pea_voice_memory_v1';
        this.memory = this.loadMemory();

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        this.recognition = SpeechRecognition ? new SpeechRecognition() : null;
        this.isListening = false;
        this.subtitleTimer = null;
        this.initSpeech();
      }

      unlockAudioEngine() {
        if (!('speechSynthesis' in window)) return;
        try {
          const silent = new SpeechSynthesisUtterance('');
          silent.volume = 0;
          window.speechSynthesis.speak(silent);
        } catch (e) {}
      }

      loadMemory() {
        try {
          const saved = localStorage.getItem(this.STORAGE_KEY);
          return saved ? JSON.parse(saved) : { frequentCommands: {}, lastVisit: null };
        } catch (e) {
          return { frequentCommands: {}, lastVisit: null };
        }
      }

      saveCommandToMemory(cleanCommand) {
        if (!cleanCommand || cleanCommand.length < 2) return;
        const count = this.memory.frequentCommands[cleanCommand] || 0;
        this.memory.frequentCommands[cleanCommand] = count + 1;
        this.memory.lastVisit = new Date().toISOString();
        localStorage.setItem(this.STORAGE_KEY, JSON.stringify(this.memory));
        this.renderFrequentChips();
      }

      getTopFrequentCommands(limit = 3) {
        return Object.entries(this.memory.frequentCommands)
          .sort((a, b) => b[1] - a[1])
          .slice(0, limit)
          .map(entry => entry[0]);
      }

      renderFrequentChips() {
        const container = document.getElementById('admin-voice-chips-list');
        if (!container) return;

        const top = this.getTopFrequentCommands(3);
        let html = `<span class="small text-primary fw-bold"><i class="bi bi-stars"></i> J.A.R.V.I.S ด่วน:</span>`;
        html += `<button type="button" class="voice-chip" onclick="jarvisBrain.promptCreateNewMonthSheet('สร้างชีตเดือนใหม่')">➕ สร้างชีตเดือนใหม่</button>`;
        html += `<button type="button" class="voice-chip" onclick="jarvisBrain.analyzeIncompleteByStatusAndMonth('วิเคราะห์ใบงานส่งงานแล้วที่ไม่สมบูรณ์ทั้งหมด')">🩺 ใบงานไม่สมบูรณ์</button>`;
        html += `<button type="button" class="voice-chip" onclick="jarvisBrain.analyzeAndSummarize()">📊 สรุปภาพรวม</button>`;
        html += `<button type="button" class="voice-chip" onclick="jarvisBrain.analyzeCrossMonthDuplicates()">🔁 เช็กซ้ำข้ามเดือน</button>`;
        html += `<button type="button" class="voice-chip" onclick="jarvisBrain.startAutoCloseDuplicates()">⚡ ปิดงานซ้ำอัตโนมัติ</button>`;

        top.forEach(cmd => {
          const safeCmd = cmd.replace(/'/g, "\\'");
          html += `<button type="button" class="voice-chip" onclick="jarvisBrain.runQuickChip('${safeCmd}')">🕒 ${cmd}</button>`;
        });

        container.innerHTML = html;
      }

      runQuickChip(cmd) {
        if (!isAdminUser) return;
        this.unlockAudioEngine();
        this.resetConversation(false);
        this.saveCommandToMemory(cmd);
        this.state.lastKeywords = [cmd];
        this.performSearchAndThink(cmd, false);
      }

      showSubtitle(speaker, htmlText, autoHideMs = 10000, choiceButtons = []) {
        if (!isAdminUser) return;
        const box = document.getElementById('jarvis-subtitle');
        if (!box) return;
        clearTimeout(this.subtitleTimer);

        let pillsHtml = '';
        if (choiceButtons && choiceButtons.length > 0) {
          pillsHtml = `<div class="d-flex flex-wrap gap-2 mt-2 pt-2 border-top border-secondary">` +
            choiceButtons.map((c, idx) =>
              `<button type="button" class="jarvis-choice-pill" onclick="jarvisBrain.triggerChoiceByIndex(${idx})">${c.icon || '👉'} ${c.label}</button>`
            ).join('') +
            `</div>`;
        }

        box.innerHTML = `
          <div class="d-flex justify-content-between align-items-center mb-1">
            <span class="fw-bold text-info small">${speaker}</span>
            <button type="button" class="btn-close btn-close-white" style="font-size:0.65rem;" onclick="document.getElementById('jarvis-subtitle').style.display='none'"></button>
          </div>
          <div>${htmlText}</div>
          ${pillsHtml}
        `;
        box.style.display = 'block';
        if (autoHideMs > 0) {
          this.subtitleTimer = setTimeout(() => { box.style.display = 'none'; }, autoHideMs);
        }
      }

      triggerChoiceByIndex(idx) {
        if (!this.state.choices || !this.state.choices[idx]) return;
        const chosen = this.state.choices[idx];
        this.resetConversation(false);
        chosen.handler();
      }

      promptChoices(htmlText, choices, defaultAllHandler = null) {
        this.state.mode = 'AWAITING_CHOICE';
        this.state.choices = choices;
        this.state.defaultAllHandler = defaultAllHandler;
        this.speak(htmlText, true, choices);
      }

      initSpeech() {
        if (!this.recognition) return;
        this.recognition.lang = 'th-TH';
        this.recognition.interimResults = false;
        this.recognition.maxAlternatives = 1;

        this.recognition.onstart = () => {
          this.isListening = true;
          document.getElementById('jarvis-btn')?.classList.add('listening');
          if ('speechSynthesis' in window) window.speechSynthesis.cancel();
          const hint = this.state.mode === 'AWAITING_CHOICE'
            ? 'พูดเลือกทางเลือก หรือแตะปุ่มด้านล่างได้เลยครับ'
            : 'เชิญสั่งการได้เลยครับบอส';
          this.showSubtitle('🎙️ J.A.R.V.I.S กำลังฟัง...', hint, 0, this.state.choices);
        };

        this.recognition.onresult = (event) => {
          this.isListening = false;
          const transcript = event.results[0][0].transcript.trim();
          this.showSubtitle('🗣️ บอสสั่งว่า:', `"${transcript}"`, 5000);
          this.handleInput(transcript);
        };

        this.recognition.onerror = (event) => {
          this.isListening = false;
          document.getElementById('jarvis-btn')?.classList.remove('listening');
          if (event.error === 'no-speech' && this.state.mode === 'AWAITING_CHOICE' && this.state.choices.length > 0) {
            this.showSubtitle('🤖 J.A.R.V.I.S:', 'บอสสามารถแตะเลือกทางเลือกจากปุ่มด้านล่าง หรือกดไมค์สั่งใหม่ได้ครับ', 14000, this.state.choices);
            this.state.mode = 'IDLE';
          } else if (event.error === 'no-speech' && this.state.mode !== 'IDLE') {
            this.resetConversation(false);
            this.speak("หากต้องการสั่งการเพิ่มเติม กดปุ่มไมค์ได้ตลอดครับบอส", false);
          } else {
            document.getElementById('jarvis-subtitle').style.display = 'none';
          }
        };

        this.recognition.onend = () => {
          this.isListening = false;
          document.getElementById('jarvis-btn')?.classList.remove('listening');
        };
      }

      toggleListening() {
        if (!isAdminUser) return;
        this.unlockAudioEngine();
        if (this.isListening && this.recognition) {
          try { this.recognition.stop(); } catch (e) {}
          this.isListening = false;
          document.getElementById('jarvis-btn')?.classList.remove('listening');
          return;
        }
        this.startListening();
      }

      startListening() {
        if (!isAdminUser) return;
        if (!this.recognition) {
          alert("เบราว์เซอร์นี้ไม่รองรับการสั่งงานด้วยเสียงครับ");
          return;
        }
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        try {
          this.recognition.start();
        } catch (e) {}
      }

      speak(htmlText, expectReply = false, choiceButtons = []) {
        if (!isAdminUser) return;
        this.showSubtitle('🤖 J.A.R.V.I.S:', htmlText, expectReply ? 0 : 11000, choiceButtons);

        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = htmlText;
        const cleanSpeech = (tempDiv.textContent || tempDiv.innerText || '').trim();

        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();

        const msg = new SpeechSynthesisUtterance(cleanSpeech);
        msg.lang = 'th-TH';
        msg.rate = 1.1;

        msg.onend = () => {
          if (expectReply && isAdminUser) {
            setTimeout(() => this.startListening(), 400);
          }
        };

        window.speechSynthesis.speak(msg);
      }

      resetConversation(clearDupContext = true) {
        this.state.mode = 'IDLE';
        this.state.choices = [];
        this.state.defaultAllHandler = null;
        this.state.lastKeywords = [];
        this.state.lastMatchedItems = [];
        if (clearDupContext) {
          this.state.duplicateContext = null;
          this.state.uncertainQueue = [];
        }
      }

      callAPIAsync(action, params) {
        return new Promise((resolve, reject) => {
          fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: action, params: params })
          })
          .then(r => r.json())
          .then(data => resolve(data))
          .catch(err => reject(err));
        });
      }

      ensureData(requireAllMonths, callback) {
        const currentFilterMonth = document.getElementById('filter-month')?.value;
        const needFetch = !globalDashResults || globalDashResults.length === 0 || (requireAllMonths && currentFilterMonth !== 'ALL');
        if (needFetch) {
          callAPI('getDashboardData', { month: requireAllMonths ? 'ALL' : (currentFilterMonth || 'ALL'), statusFilter: 'ทั้งหมด' }, (res) => {
            if (requireAllMonths) {
              const fm = document.getElementById('filter-month');
              if (fm) fm.value = 'ALL';
            }
            globalDashResults = res.results || [];
            document.getElementById('stat-total').innerText = res.stats.total;
            document.getElementById('stat-pending').innerText = res.stats.pending;
            document.getElementById('stat-contractor').innerText = res.stats.contractor;
            document.getElementById('stat-emp').innerText = res.stats.employee;
            document.getElementById('stat-completed').innerText = res.stats.completed;
            callback(globalDashResults);
          });
        } else {
          callback(globalDashResults);
        }
      }

      displayCustomListOnDashboard(items, bannerTitle, alertType = 'info') {
        const statusTab = document.querySelector('#status-tab');
        if (statusTab) bootstrap.Tab.getOrCreateInstance(statusTab).show();
        const searchBox = document.getElementById('dash-search');
        if (searchBox) searchBox.value = '';
        const banner = `<div class="alert alert-${alertType} rounded-4 shadow-sm mb-3 fw-bold"><i class="bi bi-cpu-fill me-2"></i>${bannerTitle} (${items.length} รายการ)</div>`;
        renderCardsList(items, banner);
      }

      exportCustomItemsToExcel(items, filePrefix) {
        if (!items || items.length === 0) {
          alert("ไม่มีข้อมูลสำหรับส่งออก Excel");
          return;
        }
        const rows = items.map((it, idx) => ({
          'ลำดับ': idx + 1,
          'รอบเดือน': it.sheetName || '-',
          'PEA เดิม': it.pea || '-',
          'ชื่อผู้ใช้ไฟ': it.name || '-',
          'สถานที่': it.location || '-',
          'สาเหตุ': it.reason || '-',
          'หน่วย PEA เดิม': it.colD || '-',
          'PEA ใหม่': it.colF || '-',
          'หน่วย PEA ใหม่': it.colG || '-',
          'ผู้ดำเนินการ': it.operator || '-',
          'สถานะ': it.status || '-',
          'ข้อมูลที่ขาด/ไม่สมบูรณ์': it._missingNote || 'ครบถ้วน'
        }));
        const ws = XLSX.utils.json_to_sheet(rows);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Incomplete_Report');
        XLSX.writeFile(wb, `${filePrefix}.xlsx`);
      }

      hasValidNumericGps(item) {
        if (!item || !item.gps) return false;
        const g = item.gps.trim();
        return g !== '' && !g.toLowerCase().includes('http') && !g.toLowerCase().includes('goo.gl');
      }

      // =======================================================================
      // 🧠 สมองกลวิเคราะห์เจตนาและสนทนาโต้ตอบ (v5.2)
      // =======================================================================
      handleInput(rawText) {
        if (!isAdminUser) return;
        const text = rawText.toLowerCase().trim();
        const affirmative = /(ใช่|เอา|เปิด|แสดง|ตกลง|จัดไป|ได้เลย|ดู|นำทาง|ครับ|ค่ะ)/;

        // 0. คำสั่งยกเลิก / เริ่มใหม่
        if (/(ยกเลิก|เริ่มใหม่|พอแค่นี้|ไม่ต้องแล้ว)/.test(text)) {
          this.resetConversation(true);
          this.speak("รับทราบครับบอส ยกเลิกคำสั่งเรียบร้อยครับ", false);
          return;
        }

        // 1. สั่งปิดงานที่ซ้ำกัน / เปลี่ยนสถานะเป็นส่งงานแล้ว
        if (/(ปิดงานที่ซ้ำ|ปิดงานซ้ำ|ปิดรายการซ้ำ|เปลี่ยนสถานะ.*ส่งงาน|ปิดงาน.*ซ้ำ|อัปเดต.*ซ้ำ|ดำเนินการปิดงานซ้ำ)/.test(text)) {
          this.startAutoCloseDuplicates();
          return;
        }

        // 2. กรณีกำลังรอคำตอบจากทางเลือก (AWAITING_CHOICE)
        if (this.state.mode === 'AWAITING_CHOICE' && this.state.choices.length > 0) {
          if (/(ทั้งหมด|ทั้งคู่|สองอย่าง|รวมเลย)/.test(text) && this.state.defaultAllHandler) {
            const fnAll = this.state.defaultAllHandler;
            this.resetConversation(false);
            fnAll();
            return;
          }

          if (/(อันแรก|ตัวแรก|อย่างแรก|ข้อแรก|ข้อหนึ่ง|ข้อ 1|ตัวที่ 1)/.test(text)) {
            const c0 = this.state.choices[0];
            this.resetConversation(false);
            c0.handler();
            return;
          }
          if (/(อันหลัง|อันที่สอง|ตัวหลัง|ตัวที่สอง|อย่างหลัง|ข้อสอง|ข้อ 2|ตัวที่ 2)/.test(text) && this.state.choices[1]) {
            const c1 = this.state.choices[1];
            this.resetConversation(false);
            c1.handler();
            return;
          }
          if (/(ข้อสาม|ข้อ 3|ตัวที่ 3|อันที่สาม)/.test(text) && this.state.choices[2]) {
            const c2 = this.state.choices[2];
            this.resetConversation(false);
            c2.handler();
            return;
          }

          const sortedChoices = [...this.state.choices].sort((a, b) => (b.priority || 1) - (a.priority || 1));
          for (const choice of sortedChoices) {
            if (choice.keywords.some(kw => text.includes(kw))) {
              this.resetConversation(false);
              choice.handler();
              return;
            }
          }

          this.resetConversation(false);
        }

        // 3. กรณีกำลังรอกรองเพิ่มเติม (AWAITING_FILTER)
        if (this.state.mode === 'AWAITING_FILTER') {
          const extraKeyword = this.cleanText(text);
          if (affirmative.test(text) && extraKeyword.length < 2 && this.state.lastKeywords.length > 0) {
            const combinedQuery = this.state.lastKeywords.join(' ');
            this.performSearchAndThink(combinedQuery, true);
            return;
          }
          this.state.lastKeywords.push(extraKeyword);
          const combinedQuery = this.state.lastKeywords.join(' ');
          this.saveCommandToMemory(combinedQuery);
          this.performSearchAndThink(combinedQuery, true);
          return;
        }

        if (this.state.mode === 'AWAITING_INTENT') {
          this.resetConversation(false);
          if (/(สร้าง.*เดือน|สร้างชีต|เปิดรอบเดือน)/.test(text)) { this.promptCreateNewMonthSheet(text); return; }
          if (/(ไม่สมบูรณ์|ไม่ครบ|ขาดรูป|ขาดหน่วย)/.test(text)) { this.analyzeIncompleteByStatusAndMonth(text); return; }
          if (/(สรุป|ภาพรวม|ยอด)/.test(text)) { this.analyzeAndSummarize(); return; }
          if (/(ซ้ำ)/.test(text)) { this.analyzeCrossMonthDuplicates(); return; }
          if (/(แนะนำ|ไปไหน|เริ่มตรงไหน)/.test(text)) { this.recommendBestRoute(); return; }
          if (/(ด่วน|สำคัญ|ช็อต)/.test(text)) { this.analyzeImportantWork(false); return; }
          if (/(สาเหตุ|เสียบ่อย|พัง)/.test(text)) { this.analyzeTopReasons(); return; }
          if (/(พิกัด|gps)/i.test(text)) { this.analyzeGpsReadiness(); return; }
        }

        // --- วิเคราะห์เจตนาใหม่ ---

        // [ใหม่ v5.2] สั่งสร้างชีตใบงานเดือนใหม่ใน Google Sheets (เช่น "สร้างใบงานเดือน 11", "สร้างชีตเดือนใหม่")
        if (/(สร้าง|เปิดรอบ|เพิ่ม).*(ใบงาน|ชีต|ตาราง|รอบเดือน|เดือน)/.test(text) && /(เดือน|ชีต|รอบเดือน)/.test(text)) {
          this.promptCreateNewMonthSheet(text);
          return;
        }

        // [v5.1] วิเคราะห์ใบงานที่ไม่สมบูรณ์ แยกตามสถานะและเดือน
        if (/(ไม่สมบูรณ์|ข้อมูลไม่ครบ|ไม่ครบถ้วน|ขาดรูป|ไม่มีรูป|ขาดหน่วย|ไม่มีหน่วย|ข้อมูลขาด|ตกหล่น)/.test(text)) {
          this.analyzeIncompleteByStatusAndMonth(text);
          return;
        }

        // คู่มือคำสั่งเสียง (Help)
        if (/(ทำอะไรได้บ้าง|ช่วยด้วย|มีคำสั่งอะไรบ้าง|สั่งอะไรได้บ้าง)/.test(text)) {
          this.promptChoices(
            "บอสสามารถสั่งให้ผม <b>สร้างชีตใบงานเดือนใหม่พร้อมสูตร</b>, <b>วิเคราะห์ใบงานที่ไม่สมบูรณ์แยกตามสถานะและเดือน</b>, <b>เช็ก PEA ซ้ำข้ามเดือนแล้วสั่งปิดงานอัตโนมัติ</b>, <b>สรุปภาพรวม</b> หรือ <b>ส่งออก Excel</b> ได้เลยครับ อยากเริ่มเรื่องไหนก่อนครับ?",
            [
              { label: '➕ สร้างชีตเดือนใหม่', icon: '➕', priority: 2, keywords: ['สร้าง', 'เดือนใหม่', 'ชีต'], handler: () => this.promptCreateNewMonthSheet('สร้างชีตเดือนใหม่') },
              { label: '🩺 เช็กใบงานไม่สมบูรณ์', icon: '🩺', priority: 1, keywords: ['ไม่สมบูรณ์', 'ไม่ครบ'], handler: () => this.analyzeIncompleteByStatusAndMonth('วิเคราะห์ใบงานส่งงานแล้วที่ไม่สมบูรณ์ทั้งหมด') }
            ]
          );
          return;
        }

        // ส่งออกไฟล์ Excel ด้วยเสียง
        if (/(export|เอ็กซ์เซล|ส่งออก|ดาวน์โหลดตาราง|โหลดตาราง)/i.test(text)) {
          const curStatus = document.getElementById('filter-status')?.value || 'ทั้งหมด';
          this.promptChoices(
            `พร้อมส่งออกข้อมูลสถานะ <b>"${curStatus}"</b> เป็นไฟล์ Excel ครับบอส ต้องการให้ <b>ดาวน์โหลด Excel ทันที</b> หรือ <b>เปิดตารางตรวจสอบก่อน</b> ครับ?`,
            [
              {
                label: 'ดาวน์โหลด Excel ทันที',
                icon: '📥',
                priority: 2,
                keywords: ['ดาวน์โหลด', 'ทันที', 'ส่งออก', 'โหลดเลย', 'export'],
                handler: () => {
                  showTableModal(curStatus);
                  setTimeout(() => exportTableToExcel(), 400);
                  this.speak("เปิดตารางและดาวน์โหลดไฟล์ Excel เรียบร้อยครับบอส", false);
                }
              },
              {
                label: 'เปิดตารางตรวจสอบก่อน',
                icon: '📊',
                priority: 1,
                keywords: ['ตาราง', 'ตรวจสอบ', 'เปิดดูก่อน'],
                handler: () => {
                  showTableModal(curStatus);
                  this.speak("เปิดตารางรายละเอียดบนหน้าจอเรียบร้อยครับบอส", false);
                }
              }
            ]
          );
          return;
        }

        // ประวัติคำสั่งที่ใช้บ่อย / ล้างความจำ
        if (/(ล้างความจำ|ลบประวัติคำสั่ง)/.test(text)) {
          localStorage.removeItem(this.STORAGE_KEY);
          this.memory = { frequentCommands: {}, lastVisit: null };
          this.renderFrequentChips();
          this.speak("ล้างประวัติคำสั่งที่ใช้บ่อยเรียบร้อยครับบอส", false);
          return;
        }
        if (/(คำถามที่ถามบ่อย|ใช้บ่อย|ประจำ|ค้นหาอะไรบ้าง)/.test(text)) {
          const top = this.getTopFrequentCommands(2);
          if (top.length === 0) {
            this.speak("บอสยังไม่มีประวัติคำสั่งที่ใช้บ่อยครับ ลองสั่งค้นหาหรือสรุปงานได้เลยครับ", false);
          } else {
            this.promptChoices(
              `คำสั่งที่บอสใช้บ่อยที่สุดคือ <b>"${top[0]}"</b> ครับ ต้องการให้ผม <b>ค้นหา "${top[0]}"</b> หรือ <b>สร้างชีตเดือนใหม่</b> ครับ?`,
              [
                { label: `ค้นหา "${top[0]}"`, icon: '🕒', priority: 2, keywords: [top[0].toLowerCase(), 'ค้นหา', 'เปิด'], handler: () => this.runQuickChip(top[0]) },
                { label: '➕ สร้างชีตเดือนใหม่', icon: '➕', priority: 1, keywords: ['สร้าง', 'เดือนใหม่'], handler: () => this.promptCreateNewMonthSheet('สร้างชีตเดือนใหม่') }
              ]
            );
          }
          return;
        }

        // เช็กรายการซ้ำข้ามเดือน
        if (/(ซ้ำ|ซ้ำกัน|ซ้ำซ้อน|ชนกัน)/.test(text)) {
          this.analyzeCrossMonthDuplicates();
          return;
        }

        // วิเคราะห์รายการสำคัญ / งานด่วน
        if (/(สำคัญ|งานด่วน|เร่งด่วน|ครั้งที่ 2|ครั้งที่ 3)/.test(text)) {
          const isCompare = /(เดือนนี้|เดือนที่แล้ว|เดือนก่อน|เทียบ)/.test(text);
          this.analyzeImportantWork(isCompare);
          return;
        }

        // วิเคราะห์สาเหตุการชำรุดยอดฮิต
        if (/(สาเหตุ|เสียบ่อย|พังบ่อย|ชำรุดอะไร|อันดับสาเหตุ)/.test(text)) {
          this.analyzeTopReasons();
          return;
        }

        // เช็กความพร้อมพิกัด GPS
        if (/(พิกัด|gps|จีพีเอส)/i.test(text)) {
          this.analyzeGpsReadiness();
          return;
        }

        // เปรียบเทียบผลงานผู้รับเหมา vs พนักงาน
        if (/(ผู้รับเหมา|ผรม|พนักงาน|พนง|เทียบผลงาน)/.test(text) && /(กี่|ยอด|สรุป|เท่าไหร่|ผลงาน|เทียบ)/.test(text)) {
          this.analyzeOperatorPerformance();
          return;
        }

        // เช็กยอดเฉพาะสถานะ
        if (/(รอปิด|ยังไม่ได้ปิด|ตรวจงาน|ส่งงานแล้ว)/.test(text) && /(กี่|มี|ยอด|สรุป|ดู|เช็ก)/.test(text)) {
          this.analyzePendingCloseOrders();
          return;
        }
        if (/(คงเหลือ|เหลืออีก|ค้างอยู่)/.test(text) && /(กี่|มี|ยอด|สรุป|เท่าไหร่)/.test(text)) {
          this.analyzeRemainingWork();
          return;
        }

        // แนะนำจุดเริ่มงาน
        if (/(แนะนำ|ไปไหนก่อน|เริ่มตรงไหน|วางแผน|โซนไหนเยอะ|พื้นที่ไหนเยอะ)/.test(text)) {
          this.recommendBestRoute();
          return;
        }

        // สรุปภาพรวม
        if (/(สรุป|ภาพรวม|ความคืบหน้า|กี่เปอร์เซ็นต์|มีงานอะไรบ้าง)/.test(text)) {
          this.analyzeAndSummarize();
          return;
        }

        // ค้นหาเจาะจง
        const cleaned = this.cleanText(text);
        if (cleaned.length < 2) {
          this.state.mode = 'AWAITING_INTENT';
          this.speak(`ขออภัยครับบอส ผมได้ยินว่า "${rawText}" ไม่แน่ใจว่าบอสต้องการให้ <b>สร้างชีตเดือนใหม่</b>, <b>วิเคราะห์ใบงานไม่สมบูรณ์</b>, <b>เช็ก PEA ซ้ำข้ามเดือน</b> หรือ <b>สรุปภาพรวม</b> ครับ?`, true);
          return;
        }

        this.saveCommandToMemory(cleaned);
        this.state.lastKeywords = [cleaned];
        this.performSearchAndThink(cleaned, false);
      }

      // =======================================================================
      // ➕ [ใหม่ v5.2] สร้างชีตใบงานเดือนใหม่ใน Google Sheets (คัดลอกสูตร + ล้างข้อมูล)
      // =======================================================================
      getNextMonthSuggestionFromDropdown() {
        const opts = [...document.querySelectorAll('#filter-month option')]
          .map(o => o.value)
          .filter(v => /^\d{2}\.\d{4}$/.test(v))
          .sort((a, b) => {
            const [mA, yA] = a.split('.').map(Number);
            const [mB, yB] = b.split('.').map(Number);
            return (yB * 100 + mB) - (yA * 100 + mA);
          });

        if (opts.length === 0) {
          const now = new Date();
          return {
            latestSheet: null,
            nextMonthNum: String(now.getMonth() + 1).padStart(2, '0'),
            nextSheetName: `${String(now.getMonth() + 1).padStart(2, '0')}.${now.getFullYear() + 543}`
          };
        }

        const latest = opts[0];
        const [m, y] = latest.split('.').map(Number);
        const nextM = m + 1 > 12 ? 1 : m + 1;
        const nextY = m + 1 > 12 ? y + 1 : y;
        return {
          latestSheet: latest,
          nextMonthNum: String(nextM).padStart(2, '0'),
          nextSheetName: `${String(nextM).padStart(2, '0')}.${nextY}`
        };
      }

      promptCreateNewMonthSheet(rawText) {
        const text = (rawText || '').toLowerCase();
        const parsedMonth = this.parseMonthFromText(text);
        const suggestion = this.getNextMonthSuggestionFromDropdown();

        let targetMonthNum = parsedMonth ? parsedMonth.monthNum : suggestion.nextMonthNum;
        let targetYear = suggestion.latestSheet ? Number(suggestion.latestSheet.split('.')[1]) : (new Date().getFullYear() + 543);
        if (suggestion.latestSheet && Number(suggestion.latestSheet.split('.')[0]) === 12 && Number(targetMonthNum) === 1) {
          targetYear += 1;
        }
        const targetSheetName = `${targetMonthNum}.${targetYear}`;
        const fromText = suggestion.latestSheet ? `จากต้นแบบชีต <b>${suggestion.latestSheet}</b>` : 'จากต้นแบบชีตเดือนล่าสุด';

        this.promptChoices(
          `พร้อมสร้างชีตใบงานเดือนใหม่ชื่อ <b>"${targetSheetName}"</b> ${fromText} พร้อมคงสูตรคำนวณทั้งหมดและล้างข้อมูลเก่าให้เป็นตารางว่างครับบอส ยืนยันให้สร้างเลยไหมครับ?`,
          [
            {
              label: `✅ สร้างชีต ${targetSheetName} เลย`,
              icon: '✅',
              priority: 2,
              keywords: ['ยืนยัน', 'สร้างเลย', 'สร้าง', 'ใช่', 'เอาเลย', 'ตกลง', 'จัดไป'],
              handler: () => this.executeCreateNewMonthSheet(targetMonthNum, targetSheetName)
            },
            {
              label: '❌ ยกเลิก',
              icon: '❌',
              priority: 1,
              keywords: ['ยกเลิก', 'ไม่ต้อง', 'ไม่เอา', 'ยังก่อน'],
              handler: () => {
                this.resetConversation(true);
                this.speak("รับทราบครับบอส ยกเลิกการสร้างชีตเดือนใหม่เรียบร้อยครับ", false);
              }
            }
          ]
        );
      }

      async executeCreateNewMonthSheet(targetMonthNum, expectedSheetName) {
        this.showSubtitle(
          '⚙️ J.A.R.V.I.S กำลังสร้างชีตใหม่...',
          `กำลังคัดลอกโครงสร้างและสูตรคำนวณไปยังชีต <b>${expectedSheetName}</b> ใน Google Sheets รอสักครู่ครับบอส...`,
          0
        );

        try {
          const res = await this.callAPIAsync('createNewMonthSheet', { targetMonth: targetMonthNum });
          if (!res || !res.success) {
            if (res && res.alreadyExists) {
              const initRes = await this.callAPIAsync('getInitialData', {});
              if (initRes && initRes.months) {
                populateMonthDropdowns(initRes.months, res.sheetName);
                loadDashboard();
              }
              this.speak(`ชีตเดือน <b>${res.sheetName}</b> มีอยู่ในระบบอยู่แล้วครับบอส ผมสลับหน้าจอมาที่เดือน ${res.sheetName} ให้เรียบร้อยครับ`, false);
            } else {
              this.speak(`ขออภัยครับบอส สร้างชีตไม่สำเร็จ: ${res?.message || 'กรุณาตรวจสอบว่าอัปเดตโค้ด createNewMonthSheet ใน Apps Script แล้วหรือยังครับ'}`, false);
            }
            return;
          }

          // โหลดรายชื่อเดือนใหม่จาก Google Sheets แล้วเลือกชีตใหม่ให้อัตโนมัติทันที
          const initRes = await this.callAPIAsync('getInitialData', {});
          if (initRes && initRes.months) {
            populateMonthDropdowns(initRes.months, res.sheetName);
            loadDashboard();
          }

          this.speak(
            `สร้างชีตใบงานเดือน <b>${res.sheetName}</b> เรียบร้อยแล้วครับบอส! คัดลอกโครงสร้างและสูตรจาก <b>${res.templateUsed}</b> มาครบถ้วนพร้อมล้างข้อมูลเก่าให้เรียบร้อย และเลือกหน้าจอเป็นเดือน ${res.sheetName} ให้แล้วครับ`,
            false
          );
        } catch (err) {
          this.speak("เกิดข้อผิดพลาดในการเชื่อมต่อ Google Apps Script ครับบอส รบกวนตรวจสอบการ Deploy เวอร์ชันล่าสุดครับ", false);
        }
      }

      // =======================================================================
      // 🩺 [v5.1] วิเคราะห์ใบงานที่ไม่สมบูรณ์ แยกตามสถานะและเดือน
      // =======================================================================
      parseMonthFromText(text) {
        const now = new Date();
        if (/เดือนนี้/.test(text)) {
          return { monthNum: String(now.getMonth() + 1).padStart(2, '0'), thaiName: 'เดือนนี้' };
        }
        if (/เดือนที่แล้ว|เดือนก่อน/.test(text)) {
          const prev = new Date(now.getFullYear(), now.getMonth() - 1, 1);
          return { monthNum: String(prev.getMonth() + 1).padStart(2, '0'), thaiName: 'เดือนที่แล้ว' };
        }

        const monthRules = [
          { num: '12', name: 'ธันวาคม (เดือน 12)', keys: ['ธันวาคม', 'ธันวา', 'ธ.ค.', 'เดือนสิบสอง', 'เดือน 12', 'เดือน12'] },
          { num: '11', name: 'พฤศจิกายน (เดือน 11)', keys: ['พฤศจิกายน', 'พฤศจิกา', 'พ.ย.', 'เดือนสิบเอ็ด', 'เดือน 11', 'เดือน11'] },
          { num: '10', name: 'ตุลาคม (เดือน 10)', keys: ['ตุลาคม', 'ตุลา', 'ต.ค.', 'เดือนสิบ', 'เดือน 10', 'เดือน10'] },
          { num: '09', name: 'กันยายน (เดือน 9)', keys: ['กันยายน', 'กันยา', 'ก.ย.', 'เดือนเก้า', 'เดือน 9', 'เดือน09', 'เดือน 09'] },
          { num: '08', name: 'สิงหาคม (เดือน 8)', keys: ['สิงหาคม', 'สิงหา', 'ส.ค.', 'เดือนแปด', 'เดือน 8', 'เดือน08', 'เดือน 08'] },
          { num: '07', name: 'กรกฎาคม (เดือน 7)', keys: ['กรกฎาคม', 'กรกฎา', 'ก.ค.', 'เดือนเจ็ด', 'เดือน 7', 'เดือน07', 'เดือน 07'] },
          { num: '06', name: 'มิถุนายน (เดือน 6)', keys: ['มิถุนายน', 'มิถุนา', 'มิ.ย.', 'เดือนหก', 'เดือน 6', 'เดือน06', 'เดือน 06'] },
          { num: '05', name: 'พฤษภาคม (เดือน 5)', keys: ['พฤษภาคม', 'พฤษภา', 'พ.ค.', 'เดือนห้า', 'เดือน 5', 'เดือน05', 'เดือน 05'] },
          { num: '04', name: 'เมษายน (เดือน 4)', keys: ['เมษายน', 'เมษา', 'เม.ย.', 'เดือนสี่', 'เดือน 4', 'เดือน04', 'เดือน 04'] },
          { num: '03', name: 'มีนาคม (เดือน 3)', keys: ['มีนาคม', 'มีนา', 'มี.ค.', 'เดือนสาม', 'เดือน 3', 'เดือน03', 'เดือน 03'] },
          { num: '02', name: 'กุมภาพันธ์ (เดือน 2)', keys: ['กุมภาพันธ์', 'กุมภา', 'ก.พ.', 'เดือนสอง', 'เดือน 2', 'เดือน02', 'เดือน 02'] },
          { num: '01', name: 'มกราคม (เดือน 1)', keys: ['มกราคม', 'มกรา', 'ม.ค.', 'เดือนหนึ่ง', 'เดือน 1', 'เดือน01', 'เดือน 01'] }
        ];

        for (const rule of monthRules) {
          if (rule.keys.some(k => text.includes(k))) {
            return { monthNum: rule.num, thaiName: rule.name };
          }
        }
        return null;
      }

      parseStatusFromText(text) {
        if (/(ผรม|ผู้รับเหมา)/.test(text)) {
          return { label: 'ผรม. ส่งงานแล้ว', filterFn: (s) => s === 'ผรม. ส่งงานแล้ว' };
        }
        if (/(พนง|พนักงาน|ผมต)/.test(text)) {
          return { label: 'พนง. ดำเนินการ', filterFn: (s) => s === 'พนง. ดำเนินการ' };
        }
        if (/(เสร็จสมบูรณ์|ปิดใบสั่งแล้ว)/.test(text)) {
          return { label: 'เสร็จสมบูรณ์', filterFn: (s) => s === 'เสร็จสมบูรณ์' };
        }
        if (/(งานคงเหลือ|คงเหลือ)/.test(text)) {
          return { label: 'งานคงเหลือ', filterFn: (s) => s === 'งานคงเหลือ' };
        }
        if (/(ทุกสถานะ|ทั้งหมดทุกสถานะ)/.test(text)) {
          return { label: 'ทุกสถานะ', filterFn: () => true };
        }
        return {
          label: 'ส่งงานแล้ว (ผรม. + พนง.)',
          filterFn: (s) => s === 'ผรม. ส่งงานแล้ว' || s === 'พนง. ดำเนินการ'
        };
      }

      inspectSingleItemCompleteness(item) {
        const missing = [];
        const hasVal = (v) => v !== undefined && v !== null && String(v).trim() !== '' && String(v).trim() !== '-';
        const hasPhoto = (item.pic1 && String(item.pic1).startsWith('http')) ||
                         (item.pic2 && String(item.pic2).startsWith('http'));

        if (!hasPhoto) missing.push('ยังไม่มีรูปภาพ');
        if (!hasVal(item.colD)) missing.push('ยังไม่มีหน่วย PEA เดิม');
        if (!hasVal(item.colF)) missing.push('ยังไม่มีเลข PEA ใหม่');
        if (!hasVal(item.colG)) missing.push('ยังไม่มีหน่วย PEA ใหม่');
        if (!hasVal(item.operator)) missing.push('ยังไม่มีชื่อผู้ดำเนินการ');

        return missing;
      }

      analyzeIncompleteByStatusAndMonth(rawText) {
        const text = (rawText || '').toLowerCase();
        const monthInfo = this.parseMonthFromText(text);
        const statusInfo = this.parseStatusFromText(text);

        this.speak("กำลังตรวจสอบความสมบูรณ์ของข้อมูลใบงาน รอสักครู่ครับบอส", false);

        this.ensureData(true, (allData) => {
          let targetMonthSheets = [];
          let scopedItems = allData;

          if (monthInfo) {
            const mNum = monthInfo.monthNum;
            const mNoZero = String(Number(mNum));
            const monthRegex = new RegExp(`(^|[^0-9])(0?${mNoZero})[./]\\d{4}`);
            scopedItems = allData.filter(it => monthRegex.test(String(it.sheetName || '')));
            targetMonthSheets = [...new Set(scopedItems.map(it => it.sheetName))];

            const fm = document.getElementById('filter-month');
            if (fm && targetMonthSheets.length === 1) {
              fm.value = targetMonthSheets[0];
            }
          }

          const statusMatchedItems = scopedItems.filter(it => statusInfo.filterFn(it.status));
          const incompleteItems = [];
          const missingStats = {};

          statusMatchedItems.forEach(it => {
            const missingList = this.inspectSingleItemCompleteness(it);
            if (missingList.length > 0) {
              missingList.forEach(m => { missingStats[m] = (missingStats[m] || 0) + 1; });
              incompleteItems.push({
                ...it,
                _missingNote: missingList.join(', ')
              });
            }
          });

          const monthLabel = monthInfo
            ? `ใน${monthInfo.thaiName}${targetMonthSheets.length > 0 ? ` (${targetMonthSheets.join(', ')})` : ''}`
            : 'ในทุกเดือน';

          if (statusMatchedItems.length === 0) {
            this.resetConversation(false);
            this.displayCustomListOnDashboard([], `ไม่พบใบงานสถานะ "${statusInfo.label}" ${monthLabel}`, 'secondary');
            this.speak(`ไม่พบใบงานสถานะ <b>${statusInfo.label}</b> ${monthLabel} ในระบบครับบอส`, false);
            return;
          }

          if (incompleteItems.length === 0) {
            this.resetConversation(false);
            this.displayCustomListOnDashboard(statusMatchedItems, `✅ ใบงานสถานะ "${statusInfo.label}" ${monthLabel} ข้อมูลครบถ้วนทั้งหมด`, 'success');
            this.speak(`ยอดเยี่ยมครับบอส! ใบงานสถานะ <b>${statusInfo.label}</b> ${monthLabel} ทั้งหมด <b>${statusMatchedItems.length} ใบงาน</b> มีข้อมูลครบถ้วนสมบูรณ์ทุกรายการ ไม่พบใบงานที่ไม่สมบูรณ์ครับ`, false);
            return;
          }

          this.displayCustomListOnDashboard(
            incompleteItems,
            `🩺 ใบงานไม่สมบูรณ์ [${statusInfo.label}] ${monthLabel}`,
            'danger'
          );

          let speechText = '';
          if (incompleteItems.length <= 3) {
            const detailsArr = incompleteItems.map((it, idx) =>
              `ใบงานที่ ${idx + 1} PEA <b>${it.pea}</b> คุณ<b>${it.name}</b> ${it._missingNote}`
            );
            speechText = `พบใบงาน<b>${statusInfo.label}</b>ที่ไม่สมบูรณ์${monthLabel} จำนวน <b>${incompleteItems.length} ใบงาน</b>ครับบอส ได้แก่ ${detailsArr.join(' , ')} แสดงรายการทั้งหมดบนหน้าจอเรียบร้อยครับ ต้องการ <b>เปิดฟอร์มแก้ไขใบงานที่ 1</b> หรือ <b>ส่งออกรายการนี้เป็น Excel</b> ครับ?`;
          } else {
            const topMissingText = Object.entries(missingStats)
              .sort((a, b) => b[1] - a[1])
              .map(([k, v]) => `${k} ${v} ราย`)
              .join(', ');
            const first = incompleteItems[0];
            const second = incompleteItems[1];
            speechText = `พบใบงาน<b>${statusInfo.label}</b>ที่ไม่สมบูรณ์${monthLabel} จำนวน <b>${incompleteItems.length} ใบงาน</b>ครับบอส แบ่งเป็น ${topMissingText} เช่น ใบงานที่ 1 PEA <b>${first.pea}</b> คุณ<b>${first.name}</b> ${first._missingNote} และใบงานที่ 2 PEA <b>${second.pea}</b> คุณ<b>${second.name}</b> ${second._missingNote} ผมนำรายการที่ไม่สมบูรณ์ทั้งหมด <b>${incompleteItems.length} ใบงาน</b> ขึ้นมาโชว์บนหน้าจอให้แล้วครับ ต้องการ <b>เปิดฟอร์มแก้ไขใบงานที่ 1</b> หรือ <b>ส่งออกรายการนี้เป็น Excel</b> ครับ?`;
          }

          const firstItem = incompleteItems[0];
          this.promptChoices(
            speechText,
            [
              {
                label: `📝 แก้ไขใบงานที่ 1 (PEA ${firstItem.pea})`,
                icon: '📝',
                priority: 2,
                keywords: ['แก้ไข', 'เปิดฟอร์ม', 'ใบงานที่ 1', 'ใบแรก', 'กรอกเพิ่ม'],
                handler: () => {
                  this.speak(`กำลังเปิดแบบฟอร์มใบงาน PEA ${firstItem.pea} ให้บอสแก้ไขข้อมูลครับ`, false);
                  processPendingWork(firstItem.pea, firstItem.sheetName);
                }
              },
              {
                label: `📥 ส่งออก Excel (${incompleteItems.length} ราย)`,
                icon: '📥',
                priority: 1,
                keywords: ['excel', 'เอ็กซ์เซล', 'ส่งออก', 'ดาวน์โหลด'],
                handler: () => {
                  this.exportCustomItemsToExcel(incompleteItems, `รายงานใบงานไม่สมบูรณ์_${statusInfo.label}`);
                  this.speak(`ส่งออกไฟล์ Excel รายการที่ไม่สมบูรณ์ทั้งหมด ${incompleteItems.length} รายการ เรียบร้อยครับบอส`, false);
                }
              }
            ]
          );
        });
      }

      // =======================================================================
      // 🔍 ระบบตรวจสอบความครบถ้วนของข้อมูลใบงานซ้ำ (Data Integrity Audit Engine)
      // =======================================================================
      auditSourceCompleteness(sourceItem) {
        const missing = [];
        const hasVal = (v) => v !== undefined && v !== null && String(v).trim() !== '' && String(v).trim() !== '-';
        const hasPhoto = (sourceItem.pic1 && String(sourceItem.pic1).startsWith('http')) ||
                         (sourceItem.pic2 && String(sourceItem.pic2).startsWith('http'));

        if (!hasVal(sourceItem.colF)) missing.push('เลข PEA ใหม่');
        if (!hasVal(sourceItem.colD)) missing.push('หน่วย PEA เก่า');
        if (!hasVal(sourceItem.colG)) missing.push('หน่วย PEA ใหม่');
        if (!hasVal(sourceItem.operator)) missing.push('ชื่อผู้ดำเนินการ');
        if (!hasPhoto) missing.push('รูปถ่ายหน้างาน');

        return {
          isComplete: missing.length === 0,
          missingFields: missing
        };
      }

      evaluateDuplicateReadiness(allData) {
        const monthSheets = [...new Set(allData.map(i => i.sheetName))]
          .filter(name => /^\d{2}\.\d{4}$/.test(name))
          .sort((a, b) => {
            const [mA, yA] = a.split('.').map(Number);
            const [mB, yB] = b.split('.').map(Number);
            return (yB * 100 + mB) - (yA * 100 + mA);
          });

        if (monthSheets.length < 2) return null;

        const now = new Date();
        const curKey = `${String(now.getMonth() + 1).padStart(2, '0')}.${now.getFullYear() + 543}`;
        const prevDate = new Date(now.getFullYear(), now.getMonth() - 1, 1);
        const prevKey = `${String(prevDate.getMonth() + 1).padStart(2, '0')}.${prevDate.getFullYear() + 543}`;

        const targetThisMonth = monthSheets.includes(curKey) ? curKey : monthSheets[0];
        const targetLastMonth = (monthSheets.includes(prevKey) && targetThisMonth === curKey)
          ? prevKey
          : monthSheets.find(m => m !== targetThisMonth);

        const thisItems = allData.filter(i => i.sheetName === targetThisMonth && i.pea && i.pea !== '-');
        const lastItems = allData.filter(i => i.sheetName === targetLastMonth && i.pea && i.pea !== '-');

        const thisPeas = new Set(thisItems.map(i => i.pea.trim()));
        const lastPeas = new Set(lastItems.map(i => i.pea.trim()));
        const dupPeas = [...thisPeas].filter(pea => lastPeas.has(pea));

        const readyToAutoClose = [];
        const uncertainList = [];
        const bothPendingList = [];
        const alreadyDoneList = [];

        dupPeas.forEach(pea => {
          const pairRows = [...thisItems, ...lastItems].filter(i => i.pea.trim() === pea);
          const pendingRow = pairRows.find(r => r.status === 'งานคงเหลือ');
          const completedRows = pairRows.filter(r => r.status !== 'งานคงเหลือ');
          completedRows.sort((a, b) => (a.status === 'เสร็จสมบูรณ์' ? -1 : 1));
          const sourceRow = completedRows[0] || null;

          if (!pendingRow && sourceRow) {
            alreadyDoneList.push(sourceRow);
          } else if (pendingRow && !sourceRow) {
            bothPendingList.push(pendingRow);
          } else if (pendingRow && sourceRow) {
            const audit = this.auditSourceCompleteness(sourceRow);
            if (audit.isComplete) {
              readyToAutoClose.push({ pendingItem: pendingRow, sourceItem: sourceRow, missingFields: [] });
            } else {
              uncertainList.push({ pendingItem: pendingRow, sourceItem: sourceRow, missingFields: audit.missingFields });
            }
          }
        });

        const dupSet = new Set(dupPeas);
        const allMatchedRows = [...thisItems, ...lastItems]
          .filter(i => dupSet.has(i.pea.trim()))
          .sort((a, b) => String(a.pea).localeCompare(String(b.pea)));

        return {
          targetThisMonth,
          targetLastMonth,
          dupPeas,
          readyToAutoClose,
          uncertainList,
          bothPendingList,
          alreadyDoneList,
          allMatchedRows
        };
      }

      // เช็กรายการซ้ำข้ามเดือน + วิเคราะห์ความพร้อมปิดงานอัตโนมัติ
      analyzeCrossMonthDuplicates() {
        this.speak("กำลังตรวจสอบหมายเลข PEA ที่ซ้ำกัน และตรวจความครบถ้วนของข้อมูล รอสักครู่ครับบอส", false);
        this.ensureData(true, (allData) => {
          const ctx = this.evaluateDuplicateReadiness(allData);
          if (!ctx) {
            this.resetConversation(true);
            this.speak("ในระบบมีข้อมูลชีตเดือนไม่ถึง 2 เดือน จึงยังไม่สามารถเทียบรายการซ้ำข้ามเดือนได้ครับบอส", false);
            return;
          }

          if (ctx.dupPeas.length === 0) {
            this.resetConversation(true);
            this.speak(`ตรวจสอบแล้วครับบอส ระหว่างรอบเดือน <b>${ctx.targetThisMonth}</b> กับ <b>${ctx.targetLastMonth}</b> ไม่มีหมายเลข PEA ซ้ำกันเลยครับ`, false);
            return;
          }

          this.state.duplicateContext = ctx;
          this.displayCustomListOnDashboard(ctx.allMatchedRows, `รายการ PEA ซ้ำกัน (${ctx.targetThisMonth} vs ${ctx.targetLastMonth})`);

          const readyCount = ctx.readyToAutoClose.length;
          const uncertainCount = ctx.uncertainList.length;
          const actionableTotal = readyCount + uncertainCount;

          if (actionableTotal > 0) {
            this.promptChoices(
              `พบ PEA ซ้ำกัน <b>${ctx.dupPeas.length} ราย</b> ครับบอส โดยมีงานคงเหลือที่ปิดตามรอบก่อนได้ <b>${actionableTotal} ราย</b> (ข้อมูลครบพร้อมปิดทันที <b>${readyCount} ราย</b>, ข้อมูลไม่ครบต้องถามบอสก่อน <b>${uncertainCount} ราย</b>) ต้องการให้ผม <b>ดำเนินการปิดงานที่ซ้ำกันเลย</b> หรือ <b>ดูเฉพาะรายที่ไม่แน่ใจ</b> ครับ?`,
              [
                {
                  label: `⚡ ปิดงานที่ซ้ำกัน (${actionableTotal} ราย)`,
                  icon: '⚡',
                  priority: 2,
                  keywords: ['ปิดงาน', 'ปิดเลย', 'เปลี่ยนสถานะ', 'ส่งงานแล้ว', 'ดำเนินการ'],
                  handler: () => this.startAutoCloseDuplicates()
                },
                {
                  label: `⚠️ ดูรายที่ข้อมูลไม่ครบ (${uncertainCount})`,
                  icon: '⚠️',
                  priority: 1,
                  keywords: ['ไม่แน่ใจ', 'ไม่ครบ', 'ขาดข้อมูล', 'ตรวจสอบ'],
                  handler: () => {
                    if (uncertainCount === 0) {
                      this.speak("ไม่มีรายการที่ข้อมูลไม่ครบครับบอส ทุกรายข้อมูลครบ 100% พร้อมปิดงานทันทีครับ", false);
                    } else {
                      const items = ctx.uncertainList.map(u => ({ ...u.pendingItem, _missingNote: u.missingFields.join(', ') }));
                      this.displayCustomListOnDashboard(items, 'รายการซ้ำที่ข้อมูลรอบก่อนไม่ครบ (รอการตัดสินใจ)', 'warning');
                      this.state.uncertainQueue = [...ctx.uncertainList];
                      this.askNextUncertainItem();
                    }
                  }
                }
              ]
            );
          } else {
            this.promptChoices(
              `พบ PEA ซ้ำกัน <b>${ctx.dupPeas.length} ราย</b> ครับบอส (ส่งงานเรียบร้อยแล้ว ${ctx.alreadyDoneList.length} ราย, ยังค้างทั้งคู่ ${ctx.bothPendingList.length} ราย) ต้องการ <b>ดูคู่ที่ซ้ำทั้งหมด</b> หรือ <b>สรุปภาพรวมงาน</b> ครับ?`,
              [
                {
                  label: `ดูคู่ที่ซ้ำทั้งหมด (${ctx.allMatchedRows.length})`,
                  icon: '🔁',
                  priority: 2,
                  keywords: ['ซ้ำ', 'ทั้งหมด', 'ดู'],
                  handler: () => this.speak(`แสดงคู่รายการที่ซ้ำทั้งหมด ${ctx.allMatchedRows.length} รายการ บนหน้าจอเรียบร้อยครับบอส`, false)
                },
                {
                  label: 'สรุปภาพรวมงาน',
                  icon: '📊',
                  priority: 1,
                  keywords: ['สรุป', 'ภาพรวม'],
                  handler: () => this.analyzeAndSummarize()
                }
              ]
            );
          }
        });
      }

      // ระบบสั่งปิดงานซ้ำอัตโนมัติ + ดึงรายการที่ไม่แน่ใจขึ้นมาถามบอสทีละราย
      startAutoCloseDuplicates() {
        const runWithContext = (ctx) => {
          if (!ctx || (ctx.readyToAutoClose.length === 0 && ctx.uncertainList.length === 0)) {
            this.resetConversation(true);
            this.speak("ตรวจสอบแล้ว ไม่พบรายการซ้ำที่ค้างรอปิดงานในรอบเดือนนี้ครับบอส", false);
            return;
          }
          this.executeBatchSyncAndAskUncertain(ctx);
        };

        if (this.state.duplicateContext) {
          runWithContext(this.state.duplicateContext);
        } else {
          this.speak("กำลังค้นหารายการซ้ำและตรวจสอบความครบถ้วนของข้อมูลสักครู่ครับบอส", false);
          this.ensureData(true, (allData) => {
            const ctx = this.evaluateDuplicateReadiness(allData);
            this.state.duplicateContext = ctx;
            runWithContext(ctx);
          });
        }
      }

      async syncSingleDuplicateRow(pairObj) {
        const { pendingItem, sourceItem } = pairObj;
        const searchRes = await this.callAPIAsync('searchWork', {
          month: pendingItem.sheetName,
          query: pendingItem.pea
        });
        if (!searchRes || !searchRes.success || !searchRes.data) {
          throw new Error(`ไม่พบข้อมูลแถวของ PEA ${pendingItem.pea} ในชีต ${pendingItem.sheetName}`);
        }

        const rowArray = [...searchRes.data];
        while (rowArray.length < globalHeaders.length) rowArray.push('');

        if (sourceItem.colD !== undefined && sourceItem.colD !== '') rowArray[3] = sourceItem.colD;
        if (sourceItem.colF !== undefined && sourceItem.colF !== '') rowArray[5] = sourceItem.colF;
        if (sourceItem.colG !== undefined && sourceItem.colG !== '') rowArray[6] = sourceItem.colG;

        const baseReason = sourceItem.reason || pendingItem.reason || '';
        const refNote = `(ส่งงานแล้วตามรอบ ${sourceItem.sheetName})`;
        rowArray[7] = baseReason.includes(sourceItem.sheetName) ? baseReason : `${baseReason} ${refNote}`.trim();

        if (sourceItem.pic1 && String(sourceItem.pic1).startsWith('http')) rowArray[8] = sourceItem.pic1;
        if (sourceItem.pic2 && String(sourceItem.pic2).startsWith('http')) rowArray[9] = sourceItem.pic2;
        rowArray[10] = (sourceItem.operator && sourceItem.operator !== '-') ? sourceItem.operator : 'พนง.ผมต.';

        const saveRes = await this.callAPIAsync('saveData', {
          mode: 'ucube',
          month: pendingItem.sheetName,
          rowIndex: searchRes.rowIndex,
          formData: rowArray
        });

        if (!saveRes || !saveRes.success) {
          throw new Error(saveRes?.message || `บันทึกข้อมูล PEA ${pendingItem.pea} ไม่สำเร็จ`);
        }
        return saveRes;
      }

      async executeBatchSyncAndAskUncertain(ctx) {
        const readyList = ctx.readyToAutoClose || [];
        const uncertainList = ctx.uncertainList || [];
        let autoClosedCount = 0;

        if (readyList.length > 0) {
          this.showSubtitle('⚙️ J.A.R.V.I.S กำลังดำเนินการ...', `กำลังปิดงานรายการที่ข้อมูลครบถ้วน <b>${readyList.length} ราย</b> อัตโนมัติ รอสักครู่ครับบอส...`, 0);
          for (const pair of readyList) {
            try {
              await this.syncSingleDuplicateRow(pair);
              autoClosedCount++;
            } catch (err) {
              console.error('Auto-sync error:', err);
              uncertainList.push({
                ...pair,
                missingFields: ['เกิดข้อผิดพลาดขณะอัปเดตอัตโนมัติ']
              });
            }
          }
        }

        loadDashboard();

        if (uncertainList.length === 0) {
          this.resetConversation(true);
          this.speak(`ดำเนินการเรียบร้อยครับบอส! ปิดงานรายการที่ซ้ำกันและข้อมูลครบถ้วนทั้งหมด <b>${autoClosedCount} ราย</b> เปลี่ยนสถานะเป็น <b>ส่งงานแล้ว</b> เรียบร้อยครับ`, false);
          return;
        }

        const uncertainPendingItems = uncertainList.map(u => ({ ...u.pendingItem, _missingNote: u.missingFields.join(', ') }));
        this.displayCustomListOnDashboard(uncertainPendingItems, '⚠️ รายการซ้ำที่ข้อมูลรอบก่อนไม่ครบ (รอการยืนยันจากบอส)', 'warning');

        this.state.uncertainQueue = [...uncertainList];
        const prefixText = autoClosedCount > 0
          ? `ผมปิดงานรายการที่ข้อมูลครบให้แล้ว <b>${autoClosedCount} ราย</b> ครับบอส ส่วนอีก <b>${uncertainList.length} ราย</b> ข้อมูลยังไม่ครบจึงไม่แน่ใจ — `
          : `พบรายการซ้ำ <b>${uncertainList.length} ราย</b> ที่ข้อมูลรอบก่อนหน้ายังไม่ครบครับบอส — `;

        this.askNextUncertainItem(prefixText);
      }

      askNextUncertainItem(prefixText = '') {
        if (!this.state.uncertainQueue || this.state.uncertainQueue.length === 0) {
          this.resetConversation(true);
          loadDashboard();
          this.speak("ตรวจสอบและจัดการรายการซ้ำครบทุกรายการเรียบร้อยแล้วครับบอส!", false);
          return;
        }

        const current = this.state.uncertainQueue[0];
        const { pendingItem, sourceItem, missingFields } = current;
        const missingText = missingFields.join(', ');

        this.displayCustomListOnDashboard(
          [{ ...pendingItem, _missingNote: missingText }],
          `⚠️ รอยืนยัน: PEA ${pendingItem.pea} (รอบ ${sourceItem.sheetName} ขาด: ${missingText})`,
          'warning'
        );

        this.promptChoices(
          `${prefixText}รายการ PEA <b>${pendingItem.pea}</b> คุณ<b>${pendingItem.name}</b> (ข้อมูลรอบ ${sourceItem.sheetName} ขาด: <b>${missingText}</b>) จะให้ผม <b>ปิดงานเป็นส่งงานแล้วเลย</b>, <b>เปิดฟอร์มกรอกเพิ่ม</b> หรือ <b>ข้ามรายการนี้</b> ครับ?`,
          [
            {
              label: '✅ ปิดเป็นส่งงานแล้วเลย',
              icon: '✅',
              priority: 2,
              keywords: ['ปิดเลย', 'ปิดงาน', 'ส่งงานแล้ว', 'ยืนยัน', 'ใช่', 'เอาเลย'],
              handler: async () => {
                this.showSubtitle('⚙️ กำลังอัปเดตสถานะ...', `กำลังเปลี่ยนสถานะ PEA <b>${pendingItem.pea}</b> เป็นส่งงานแล้วครับบอส...`, 0);
                try {
                  await this.syncSingleDuplicateRow(current);
                  this.state.uncertainQueue.shift();
                  this.askNextUncertainItem(`เปลี่ยนสถานะ PEA <b>${pendingItem.pea}</b> เป็นส่งงานแล้วเรียบร้อยครับ — `);
                } catch (e) {
                  this.state.uncertainQueue.shift();
                  this.askNextUncertainItem(`ขออภัยครับ อัปเดต PEA ${pendingItem.pea} ไม่สำเร็จ (${e.message}) — `);
                }
              }
            },
            {
              label: '📝 เปิดฟอร์มกรอกเพิ่ม',
              icon: '📝',
              priority: 2,
              keywords: ['เปิดฟอร์ม', 'กรอกเพิ่ม', 'แก้ไข', 'กรอกข้อมูล'],
              handler: () => {
                this.resetConversation(true);
                this.speak(`กำลังเปิดแบบฟอร์มใบงาน PEA ${pendingItem.pea} ให้บอสกรอกข้อมูลเพิ่มเติมครับ`, false);
                processPendingWork(pendingItem.pea, pendingItem.sheetName);
              }
            },
            {
              label: '⏭️ ข้ามรายการนี้',
              icon: '⏭️',
              priority: 1,
              keywords: ['ข้าม', 'ไม่ต้อง', 'ยังไม่ปิด', 'ผ่าน'],
              handler: () => {
                this.state.uncertainQueue.shift();
                this.askNextUncertainItem(`ข้ามรายการ PEA <b>${pendingItem.pea}</b> ไว้ก่อนครับ — `);
              }
            }
          ]
        );
      }

      // =======================================================================
      // สรุปภาพรวม & หมวดวิเคราะห์อื่นๆ
      // =======================================================================
      analyzeAndSummarize() {
        this.ensureData(false, (all) => {
          const total = all.length;
          const pendingList = all.filter(i => i.status === 'งานคงเหลือ');
          const waitingCloseList = all.filter(i => i.status === 'ผรม. ส่งงานแล้ว' || i.status === 'พนง. ดำเนินการ');
          const completedCount = all.filter(i => i.status === 'เสร็จสมบูรณ์').length;
          const donePercent = total > 0 ? Math.round(((waitingCloseList.length + completedCount) / total) * 100) : 0;

          this.promptChoices(
            `สรุปภาพรวมครับบอส จากทั้งหมด <b>${total} ใบงาน</b> ดำเนินการหน้างานแล้ว <b>${donePercent}%</b> ครับ แบ่งเป็น งานคงเหลือ <b>${pendingList.length}</b>, ส่งงานรอปิดใบสั่ง <b>${waitingCloseList.length}</b> และปิดเสร็จสมบูรณ์ <b>${completedCount}</b> ใบงานครับ ต้องการให้เปิดดูรายการ <b>งานคงเหลือ</b> หรือรายการ <b>รอปิดใบสั่ง</b> ครับ?`,
            [
              {
                label: `งานคงเหลือ (${pendingList.length})`,
                icon: '⏳',
                priority: 2,
                keywords: ['งานคงเหลือ', 'คงเหลือ', 'ค้าง'],

      isImportantItem(item) {
        const sheet = (item.sheetName || '').toLowerCase();
        const reason = (item.reason || '').toLowerCase();
        return sheet.includes('ด่วน') || reason.includes('ช็อตไหม้') || /ครั้งที่\s*[2-9]/.test(reason);
      }

      analyzeImportantWork(isCompareMonths) {
        this.ensureData(isCompareMonths, (allData) => {
          if (isCompareMonths) {
            const monthSheets = [...new Set(allData.map(i => i.sheetName))]
              .filter(name => /^\d{2}\.\d{4}$/.test(name))
              .sort((a, b) => {
                const [mA, yA] = a.split('.').map(Number);
                const [mB, yB] = b.split('.').map(Number);
                return (yB * 100 + mB) - (yA * 100 + mA);
              });

            const now = new Date();
            const curKey = `${String(now.getMonth() + 1).padStart(2, '0')}.${now.getFullYear() + 543}`;
            const prevDate = new Date(now.getFullYear(), now.getMonth() - 1, 1);
            const prevKey = `${String(prevDate.getMonth() + 1).padStart(2, '0')}.${prevDate.getFullYear() + 543}`;

            const thisM = monthSheets.includes(curKey) ? curKey : (monthSheets[0] || curKey);
            const lastM = (monthSheets.includes(prevKey) && thisM === curKey) ? prevKey : (monthSheets.find(m => m !== thisM) || prevKey);

            const impThis = allData.filter(i => i.sheetName === thisM && this.isImportantItem(i));
            const impLast = allData.filter(i => i.sheetName === lastM && this.isImportantItem(i));
            const pendingThis = impThis.filter(i => i.status === 'งานคงเหลือ');

            this.promptChoices(
              `สรุปรายการสำคัญครับบอส รอบเดือน <b>${thisM}</b> มี <b>${impThis.length} ราย</b> (คงเหลือ ${pendingThis.length} ราย) ส่วนเดือนก่อนหน้า <b>${lastM}</b> มี <b>${impLast.length} ราย</b> ครับ ต้องการเปิดดูรายการสำคัญของ <b>เดือนนี้ (${thisM})</b> หรือ <b>เดือนที่แล้ว (${lastM})</b> ครับ?`,
              [
                {
                  label: `เดือนนี้ ${thisM} (${impThis.length})`,
                  icon: '📅',
                  priority: 1,
                  keywords: ['เดือนนี้', 'ปัจจุบัน', thisM],
                  handler: () => {
                    this.displayCustomListOnDashboard(impThis, `รายการสำคัญรอบเดือน ${thisM}`);
                    this.speak(`แสดงรายการสำคัญรอบเดือน ${thisM} จำนวน ${impThis.length} รายการ เรียบร้อยครับบอส`, false);
                  }
                },
                {
                  label: `เดือนที่แล้ว ${lastM} (${impLast.length})`,
                  icon: '🗓️',
                  priority: 1,
                  keywords: ['เดือนที่แล้ว', 'เดือนก่อน', 'ที่แล้ว', lastM],
                  handler: () => {
                    this.displayCustomListOnDashboard(impLast, `รายการสำคัญรอบเดือน ${lastM}`);
                    this.speak(`แสดงรายการสำคัญรอบเดือน ${lastM} จำนวน ${impLast.length} รายการ เรียบร้อยครับบอส`, false);
                  }
                }
              ]
            );
          } else {
            const impAll = allData.filter(i => this.isImportantItem(i));
            const impPending = impAll.filter(i => i.status === 'งานคงเหลือ');

            this.promptChoices(
              `พบรายการสำคัญและงานด่วนทั้งหมด <b>${impAll.length} รายการ</b> และยังเป็น <b>งานคงเหลือ ${impPending.length} รายการ</b> ครับบอส ต้องการเปิดดูเฉพาะ <b>งานสำคัญที่ยังค้าง</b> หรือ <b>รายการสำคัญทั้งหมด</b> ครับ?`,
              [
                {
                  label: `สำคัญที่ยังค้าง (${impPending.length})`,
                  icon: '⏳',
                  priority: 2,
                  keywords: ['ค้าง', 'คงเหลือ', 'ยังไม่เสร็จ'],
                  handler: () => {
                    this.displayCustomListOnDashboard(impPending, 'รายการสำคัญ / งานด่วน ที่ยังคงเหลือ');
                    this.speak(`แสดงรายการสำคัญที่ยังค้าง ${impPending.length} รายการ เรียบร้อยครับบอส`, false);
                  }

                {
                  label: `สำคัญทั้งหมด (${impAll.length})`,
                  icon: '🔥',

        this.ensureData(false, (all) => {

                keywords: ['มีพิกัด', 'พร้อมลุย', 'พร้อมนำทาง', 'พร้อม', 'มี'],
                handler: () => {
                  this.displayCustomListOnDashboard(validGps, 'งานคงเหลือที่มีพิกัดตัวเลขพร้อมนำทาง');
                  this.speak(`แสดงรายการที่มีพิกัดพร้อมลุยจำนวน ${validGps.length} รายการ บนหน้าจอเรียบร้อยครับบอส`, false);
                }
              }
            ]
          );
        });
      }

      performSearchAndThink(keyword, isFollowUp) {
        const statusTab = document.querySelector('#status-tab');
        if (statusTab) bootstrap.Tab.getOrCreateInstance(statusTab).show();
        
        const searchBox = document.getElementById('dash-search');
        if (searchBox) {
          searchBox.value = keyword;
          filterDashboard();
        }

        const terms = keyword.toLowerCase().split(/\s+/);
        const matched = (globalDashResults || []).filter(item => {
          const fullText = `${item.pea} ${item.name} ${item.location} ${item.reason} ${item.status} ${item.sheetName}`.toLowerCase();
          return terms.every(t => fullText.includes(t));
        });

        this.state.lastMatchedItems = matched;

        if (matched.length === 0) {
          this.resetConversation(false);
          this.speak(`ไม่พบใบงานที่ตรงกับ "${keyword}" เลยครับบอส ลองระบุชื่อพื้นที่หรือสาเหตุอื่นดูไหมครับ?`, false);
        } else if (matched.length === 1) {
          const item = matched[0];
          const isPending = item.status === 'งานคงเหลือ';
          const primaryLabel = isPending ? 'เปิดฟอร์มส่งงาน' : 'เปิดตรวจสอบ/ปิดใบสั่ง';
          const primaryHandler = () => {
            if (isPending) {
              this.speak(`กำลังเปิดแบบฟอร์มใบงาน PEA ${item.pea} ให้ครับบอส`, false);
              processPendingWork(item.pea, item.sheetName);
            } else {
              this.speak(`กำลังเปิดหน้าต่างตรวจสอบใบงาน PEA ${item.pea} ให้ครับบอส`, false);
              viewCompletedWork(encodeURIComponent(JSON.stringify(item)));
            }
          };

          if (this.hasValidNumericGps(item)) {
            this.promptChoices(
              `พบ 1 ใบงานครับบอส PEA <b>${item.pea}</b> คุณ${item.name} สถานะ <b>${item.status}</b> ต้องการ <b>${primaryLabel}</b> หรือ <b>เปิดแผนที่นำทาง GPS</b> เลยครับ?`,
              [
                { label: primaryLabel, icon: '📝', priority: 1, keywords: ['ฟอร์ม', 'ส่งงาน', 'ตรวจสอบ', 'ปิดใบสั่ง', 'เปิดใบงาน'], handler: primaryHandler },
                {
                  label: 'เปิดแผนที่นำทาง GPS',
                  icon: '🗺️',
                  priority: 2,
                  keywords: ['แผนที่', 'นำทาง', 'พิกัด', 'gps'],
                  handler: () => {
                    this.speak(`กำลังเปิดแผนที่นำทางไปยัง PEA ${item.pea} ครับบอส`, false);
                    this.executeMapRouting([item]);
                  }
                }
              ]
            );
          } else {
            this.promptChoices(
              `พบ 1 ใบงานครับบอส PEA <b>${item.pea}</b> คุณ${item.name} สถานะ <b>${item.status}</b> ต้องการ <b>${primaryLabel}</b> หรือ <b>ดูรายการบนหน้าจอ</b> ครับ?`,
              [
                { label: primaryLabel, icon: '📝', priority: 2, keywords: ['ฟอร์ม', 'ส่งงาน', 'ตรวจสอบ', 'ปิดใบสั่ง', 'เปิดใบงาน'], handler: primaryHandler },
                { label: 'ดูรายการบนหน้าจอ', icon: '📋', priority: 1, keywords: ['หน้าจอ', 'รายการ', 'ไม่ต้อง'], handler: () => this.speak(`แสดงข้อมูล PEA ${item.pea} บนหน้าจอเรียบร้อยครับบอส`, false) }
              ]
            );
          }
        } else if (matched.length > 10 && !isFollowUp) {
          const pendingInMatch = matched.filter(m => m.status === 'งานคงเหลือ');
          this.promptChoices(
            `พบถึง <b>${matched.length} ใบงาน</b> ครับบอส ค่อนข้างเยอะเลย ต้องการกรองเฉพาะ <b>งานคงเหลือ (${pendingInMatch.length})</b> หรือ <b>แสดงทั้งหมด (${matched.length})</b> ครับ?`,
            [
              {
                label: `เฉพาะงานคงเหลือ (${pendingInMatch.length})`,
                icon: '⏳',
                priority: 2,
                keywords: ['งานคงเหลือ', 'คงเหลือ', 'ค้าง'],
                handler: () => {
                  this.displayCustomListOnDashboard(pendingInMatch, `ค้นหา "${keyword}" (เฉพาะงานคงเหลือ)`);
                  this.speak(`กรองเฉพาะงานคงเหลือจำนวน ${pendingInMatch.length} ใบงาน เรียบร้อยครับบอส`, false);
                }
              },
              {
                label: `แสดงทั้งหมด (${matched.length})`,
                icon: '📋',
                priority: 1,
                keywords: ['ทั้งหมด', 'ทุกสถานะ'],
                handler: () => this.speak(`แสดงทั้งหมด ${matched.length} ใบงาน บนหน้าจอเรียบร้อยครับบอส`, false)
              }
            ]
          );
        } else {
          const withGps = matched.filter(m => this.hasValidNumericGps(m) && m.status === 'งานคงเหลือ');
          if (withGps.length > 0 && withGps.length <= 9) {
            this.promptChoices(
              `พบ <b>${matched.length} ใบงาน</b> ครับ และมี <b>${withGps.length} งานคงเหลือ</b> ที่มีพิกัดพร้อมนำทาง ต้องการ <b>เปิดแผนที่นำทาง</b> หรือ <b>ดูรายการบนหน้าจอ</b> ครับ?`,
              [
                {
                  label: `เปิดแผนที่นำทาง (${withGps.length} จุด)`,
                  icon: '🧭',
                  priority: 2,
                  keywords: ['แผนที่', 'นำทาง', 'gps', 'เปิดแมพ'],
                  handler: () => {
                    this.speak(`กำลังเปิดแผนที่นำทางทั้ง ${withGps.length} จุดครับบอส`, false);
                    this.executeMapRouting(withGps);
                  }
                },
                {
                  label: `ดูรายการบนหน้าจอ (${matched.length})`,
                  icon: '📋',
                  priority: 1,
                  keywords: ['รายการ', 'หน้าจอ', 'ดูบนหน้าจอ', 'ไม่ต้อง'],
                  handler: () => this.speak(`แสดง ${matched.length} ใบงาน ที่เกี่ยวกับ ${keyword} บนหน้าจอเรียบร้อยครับบอส`, false)
                }
              ]
            );
          } else {
            this.resetConversation(false);
            this.speak(`แสดง <b>${matched.length} ใบงาน</b> ที่เกี่ยวกับ ${keyword} บนหน้าจอเรียบร้อยครับบอส`, false);
          }
        }
      }

      executeMapRouting(items) {
        let url = "https://www.google.com/maps/dir/Current+Location/";
        items.slice(0, 9).forEach(item => {
          const cleanGps = item.gps.trim().replace(/\s/g, '');
          if (!cleanGps.toLowerCase().includes('http')) url += cleanGps + "/";
        });
        window.open(url, '_blank');
      }

      cleanText(text) {
        let kw = text
          .replace(/ช่วย|กรอง|หา|ค้นหา|ใบงาน|ที่อยู่|ในโซน|เอาเฉพาะ|เฉพาะ|เปิดดู|ดูงาน|ให้หน่อย|หน่อย|ครับ|ค่ะ|สิ/g, '')
          .replace(/กับ|และ|เว้นวรรค/g, ' ');
        const knownReasons = ["ช็อตไหม้", "น้ำเข้า", "ผ้ามัว", "ไม่หมุน", "ติดขัด", "ชำรุด", "ขั้วต่อ", "แป้นผุ"];
        knownReasons.forEach(reason => {
          if (kw.includes(reason)) kw = kw.replace(new RegExp(reason, 'g'), ' ' + reason + ' ');
        });
        return kw.replace(/\s+/g, ' ').trim();
      }
    }

    const jarvisBrain = new JarvisVoiceBrain();
    function toggleJarvis() {
      if (!isAdminUser) return;
      jarvisBrain.toggleListening();
    }
  </script>
</body>
