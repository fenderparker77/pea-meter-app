<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบรับ-ส่งงาน เปลี่ยนมิเตอร์</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3f2b96">
  <link rel="apple-touch-icon" href="1000002294.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <style>
    body { background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%); background-attachment: fixed; font-family: 'Sarabun', sans-serif; color: #333; }
    .container { max-width: 800px; margin-top: 20px; padding-bottom: 120px; }
    
    .glass-card { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.5); border-radius: 16px; box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1); padding: 25px; margin-bottom: 20px; }
    .form-control, .form-select { background: rgba(255, 255, 255, 0.8); border: 1px solid rgba(200, 200, 200, 0.5); border-radius: 10px; box-shadow: inset 0 1px 3px rgba(0,0,0,0.05); }

    .nav-tabs { border-bottom: none; justify-content: center; gap: 10px; margin-bottom: 15px; }
    .nav-tabs .nav-link { border: none; background: rgba(255, 255, 255, 0.5); border-radius: 30px; color: #666; padding: 10px 25px; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .nav-tabs .nav-link.active { background: linear-gradient(135deg, #a8c0ff 0%, #3f2b96 100%); color: #fff; font-weight: bold; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(63, 43, 150, 0.3); }

    .app-logo { max-height: 140px; border-radius: 20px; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.15)); margin-bottom: 15px; }
    .app-title { font-weight: 800; background: -webkit-linear-gradient(45deg, #3f2b96, #a8c0ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    /* 🚀 สไตล์สำหรับปุ่มสถิติที่คลิกได้ */
    .stat-card { border-radius: 15px; color: #fff; text-align: center; padding: 15px; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.4); backdrop-filter: blur(5px); cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
    .stat-card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.15); }
    
    .bg-total { background: linear-gradient(135deg, #3498db, #2980b9); }
    .bg-pending { background: linear-gradient(135deg, #e74c3c, #c0392b); }
    .bg-contractor { background: linear-gradient(135deg, #f1c40f, #f39c12); } /* สีผู้รับเหมา */
    .bg-emp { background: linear-gradient(135deg, #9b59b6, #8e44ad); } /* สีพนักงาน */
    .bg-completed { background: linear-gradient(135deg, #2ecc71, #27ae60); }

    .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; }
    .loader { display: none; margin: 10px auto; border: 4px solid #f3f3f3; border-radius: 50%; border-top: 4px solid #764ba2; width: 35px; height: 35px; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    
    .image-preview { max-width: 100%; height: auto; margin-top: 10px; border-radius: 12px; display: none; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .detail-img { width: 100%; object-fit: cover; border-radius: 12px; border: 1px solid #ddd; max-height: 400px; }

    .jarvis-fab { position: fixed; bottom: 30px; right: 30px; width: 65px; height: 65px; border-radius: 50%; background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); color: #00d2ff; border: 2px solid #00d2ff; box-shadow: 0 0 15px rgba(0, 210, 255, 0.5); font-size: 28px; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 1050; transition: all 0.3s ease; }
    .jarvis-fab.listening { animation: pulse-ring 1.5s infinite; border-color: #fff; color: #fff; box-shadow: 0 0 25px rgba(233, 64, 87, 0.8); }
    @keyframes pulse-ring { 0% { box-shadow: 0 0 0 0 rgba(233, 64, 87, 0.7); } 70% { box-shadow: 0 0 0 20px rgba(233, 64, 87, 0); } 100% { box-shadow: 0 0 0 0 rgba(233, 64, 87, 0); } }

    .route-cb { width: 25px; height: 25px; cursor: pointer; }
    .route-panel { position: fixed; bottom: 110px; right: 30px; z-index: 1040; display: none; }
    
    /* 🚀 สไตล์สำหรับตาราง Excel ใน Modal */
    .table-container { max-height: 60vh; overflow: auto; background: #fff; border-radius: 8px; }
    .table-container table { white-space: nowrap; margin-bottom: 0; }
    .table-container th { position: sticky; top: 0; background-color: #34495e; color: #fff; z-index: 1; text-align: center; }
    .table-container td { vertical-align: middle; }
  </style>
</head>
<body>

  <button id="jarvis-btn" class="jarvis-fab" onclick="toggleJarvis()" title="กดเพื่อสั่งการด้วยเสียง"><i class="bi bi-mic-fill"></i></button>

  <div id="route-panel" class="route-panel">
    <button class="btn btn-primary rounded-pill px-4 py-3 shadow-lg fw-bold" onclick="startRouting()">
      <i class="bi bi-geo-alt-fill fs-5 me-2"></i> นำทางงาน (<span id="route-count">0</span>)
    </button>
  </div>

  <datalist id="details-list">
    <option value="ชำรุด/ไม่หมุน/ติดขัด"><option value="ช็อตไหม้"><option value="LCD ไม่แสดงค่า">
    <option value="ขั้วต่อสายชำรุด"><option value="น้ำเข้า"><option value="ชำรุด / ผ้ามัว"><option value="แป้นผุ/คว่ำเอียง/ไม่หมุน">
  </datalist>
  <datalist id="operator-list"><option value="ผรม."><option value="พนง.ผมต."></datalist>

  <div class="container">
    <div class="text-center mb-4 mt-2">
      <img src="1000002294.png" alt="PEA Meter Logo" class="app-logo">
      <h2 class="app-title mt-2">ระบบรับ-ส่งงาน เปลี่ยนมิเตอร์</h2>
      <p class="text-muted small">PEA Smart Operation by J.A.R.V.I.S</p>
    </div>
    
    <ul class="nav nav-tabs" id="myTab" role="tablist">
      <li class="nav-item"><button class="nav-link active" id="search-tab" data-bs-toggle="tab" data-bs-target="#search-panel" type="button">ส่งงาน ส.ป.มิเตอร์</button></li>
      <li class="nav-item"><button class="nav-link" id="status-tab" data-bs-toggle="tab" data-bs-target="#status-panel" type="button">สถานะใบงาน</button></li>
    </ul>

    <div class="tab-content mt-3">
      <!-- แท็บ: ส่งงาน -->
      <div class="tab-pane fade show active" id="search-panel" role="tabpanel">
        <div class="glass-card">
          <label class="form-label fw-bold text-secondary">รูปแบบการส่งงาน:</label>
          <select id="work-mode" class="form-select mb-3" onchange="toggleWorkMode()">
            <option value="ucube">1. จากใบงาน UCUBE</option>
            <option value="general">2. ส.ป.มิเตอร์ ทั่วไป</option>
          </select>

          <div id="search-section">
            <label class="form-label fw-bold text-secondary">เลือกเดือน (แผ่นงาน):</label>
            <select id="month-select" class="form-select mb-3"></select>
            
            <label class="form-label fw-bold text-secondary">ค้นหาใบงาน:</label>
            <div class="input-group">
              <input type="text" id="search-query" class="form-control" placeholder="ระบุ PEA หรือ ชื่อผู้ใช้ไฟฟ้า">
              <button class="btn btn-primary px-4" onclick="searchData()"><i class="bi bi-search"></i> ค้นหา</button>
            </div>
          </div>
        </div>

        <div id="search-loader" class="loader"></div>
        
        <div id="form-container" style="display:none;">
          <div class="text-center mb-3" id="status-badge-container">
            <span id="status-display" class="badge rounded-pill fs-6 px-4 py-2 shadow-sm"></span>
          </div>
          <form id="data-form" class="glass-card">
            <input type="hidden" id="row-index">
            <div id="dynamic-fields"></div>
            <!-- 🚀 ปุ่มบันทึกส่งงาน (เดี๋ยวดัก Confirm ใน JS) -->
            <button type="button" id="save-btn" class="btn btn-success w-100 mt-4 py-3 fw-bold rounded-pill shadow" onclick="saveData()">
              <i class="bi bi-cloud-arrow-up"></i> บันทึกส่งงาน
            </button>
          </form>
        </div>
      </div>

      <!-- แท็บ: สถานะใบงาน -->
      <div class="tab-pane fade" id="status-panel" role="tabpanel">
        <div class="glass-card">
          <div class="row">
            <div class="col-6">
              <label class="form-label fw-bold text-secondary">สถานะ:</label>
              <!-- 🚀 อัปเดต Dropdown ให้มีแยกสถานะ -->
              <select id="filter-status" class="form-select" onchange="loadDashboard()">
                <option value="ทั้งหมด" selected>ทั้งหมด</option>
                <option value="งานคงเหลือ">งานคงเหลือ</option>
                <option value="ผู้รับเหมาส่งงานแล้ว">ผู้รับเหมาส่งงานแล้ว</option>
                <option value="พนง. ดำเนินการแล้ว">พนง. ดำเนินการแล้ว</option>
                <option value="เสร็จสมบูรณ์">เสร็จสมบูรณ์</option>
              </select>
            </div>
            <div class="col-6">
              <label class="form-label fw-bold text-secondary">ประจำเดือน:</label>
              <select id="filter-month" class="form-select" onchange="loadDashboard()"></select>
            </div>
          </div>
          <div class="mt-4">
            <input type="text" id="dash-search" class="form-control rounded-pill px-4" placeholder="🔍 ค้นหาแบบตรงตัวใส่ฟันหนู (เช่น &quot;ครั้งที่ 3&quot;)" onkeyup="filterDashboard()">
          </div>
        </div>
        
        <div id="dash-loader" class="loader"></div>
        
        <div class="row flex-column-reverse flex-md-row">
          <div class="col-md-7">
            <div class="list-group" id="dashboard-list"></div>
          </div>
          <div class="col-md-5 mb-3">
            <!-- 🚀 ปรับเลย์เอาต์ปุ่มสถิติ 5 ปุ่ม ให้คลิกได้ -->
            <div class="row g-2">
              <div class="col-12"><div class="stat-card bg-total" onclick="showTableModal('ทั้งหมด')"><h6 class="mb-1 text-white-50">ใบงานทั้งหมด <i class="bi bi-table ms-1"></i></h6><h3 id="stat-total" class="fw-bold mb-0">0</h3></div></div>
              <div class="col-6"><div class="stat-card bg-pending" onclick="showTableModal('งานคงเหลือ')"><h6 class="mb-1 text-white-50">คงเหลือ <i class="bi bi-table ms-1"></i></h6><h3 id="stat-pending" class="fw-bold mb-0">0</h3></div></div>
              <div class="col-6"><div class="stat-card bg-completed" onclick="showTableModal('เสร็จสมบูรณ์')"><h6 class="mb-1 text-white-50">เสร็จสมบูรณ์ <i class="bi bi-table ms-1"></i></h6><h3 id="stat-completed" class="fw-bold mb-0">0</h3></div></div>
              <div class="col-6"><div class="stat-card bg-contractor" onclick="showTableModal('ผู้รับเหมาส่งงานแล้ว')"><h6 class="mb-1 text-white-50">ผรม. ส่งงาน <i class="bi bi-table ms-1"></i></h6><h3 id="stat-contractor" class="fw-bold mb-0 text-dark">0</h3></div></div>
              <div class="col-6"><div class="stat-card bg-emp" onclick="showTableModal('พนง. ดำเนินการแล้ว')"><h6 class="mb-1 text-white-50">พนง. ส่งงาน <i class="bi bi-table ms-1"></i></h6><h3 id="stat-emp" class="fw-bold mb-0">0</h3></div></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal สำหรับปิดใบสั่ง -->
  <div class="modal fade" id="orderModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content glass-card border-0">
        <div class="modal-header border-bottom">
          <h5 class="modal-title fw-bold text-primary"><i class="bi bi-clipboard-check"></i> ตรวจสอบข้อมูลเพื่อปิดใบสั่ง</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="orderModalBody"></div>
        <div class="modal-footer border-top">
          <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">ยกเลิก</button>
          <!-- 🚀 ปุ่มปิดใบสั่ง (เดี๋ยวดัก Confirm ใน JS) -->
          <button type="button" class="btn btn-success rounded-pill px-5 fw-bold shadow" id="btn-close-order" onclick="submitCloseOrder()">ปิดใบสั่ง</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 🚀 Modal สำหรับโชว์ตาราง Data Grid -->
  <div class="modal fade" id="tableModal" tabindex="-1">
    <div class="modal-dialog modal-xl modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-dark text-white">
          <h5 class="modal-title fw-bold" id="tableModalTitle"><i class="bi bi-table"></i> รายละเอียดข้อมูล</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-0">
          <div class="table-container">
            <table class="table table-bordered table-striped table-hover mb-0">
              <thead id="tableModalHead"></thead>
              <tbody id="tableModalBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(err => console.error(err)); }); }
    
    // ⚠️ ลิงก์ API ตัวเดิมของบอสนะครับ
    const API_URL = "https://script.google.com/macros/s/AKfycbxV5LU6BkYkodydL4g8ajf6jxZVACRxXOARt7K0poJ08RLT8YIbSzNiJdcOIP6WB62g/exec";

    let globalHeaders = [];
    let currentOrderRow = null; 
    let currentOrderSheetName = null; 
    let globalDashResults = []; // 🚀 เก็บข้อมูลสำหรับสร้างตาราง

    function callAPI(action, params, onSuccess) {
      fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: action, params: params }) })
      .then(response => response.json())
      .then(data => onSuccess(data))
      .catch(error => { alert('เชื่อมต่อล้มเหลว'); document.getElementById('search-loader').style.display = 'none'; document.getElementById('dash-loader').style.display = 'none'; if(document.getElementById('save-btn')) { document.getElementById('save-btn').disabled = false; }});
    }

    window.onload = function() { callAPI('getInitialData', {}, initApp); }

    function initApp(res) {
      globalHeaders = res.headers;
      const monthSelect = document.getElementById('month-select');
      const filterMonth = document.getElementById('filter-month');
      monthSelect.add(new Option("-- แสดงทั้งหมด --", "ALL"));
      filterMonth.add(new Option("-- แสดงทั้งหมด --", "ALL"));
      res.months.forEach(month => {
        monthSelect.add(new Option(month, month));
        filterMonth.add(new Option(month, month));
      });
      loadDashboard();
    }

    function getDirectImageUrl(url) { if (!url) return ''; let match = url.match(/\/d\/([a-zA-Z0-9_-]+)/); return (match && match[1]) ? 'https://drive.google.com/thumbnail?id=' + match[1] + '&sz=w1000' : url; }

    function toggleWorkMode() {
      const mode = document.getElementById('work-mode').value;
      if (mode === 'general') { document.getElementById('search-section').style.display = 'none'; document.getElementById('status-badge-container').style.display = 'none'; renderFormUI(new Array(globalHeaders.length).fill(''), 'general'); document.getElementById('save-btn').className = 'btn btn-success w-100 mt-4 py-3 fw-bold rounded-pill shadow'; document.getElementById('save-btn').innerHTML = '<i class="bi bi-cloud-arrow-up"></i> บันทึกส่งงาน'; } 
      else { document.getElementById('search-section').style.display = 'block'; document.getElementById('form-container').style.display = 'none'; }
    }

    function searchData() {
      const month = document.getElementById('month-select').value;
      const query = document.getElementById('search-query').value.trim();
      if(!query) { alert('กรุณาระบุข้อมูล'); return; }
      
      document.getElementById('search-loader').style.display = 'block'; document.getElementById('form-container').style.display = 'none';
      callAPI('searchWork', { month: month, query: query }, function(res) {
        document.getElementById('search-loader').style.display = 'none';
        if (!res.success) { alert(res.message); return; }
        
        document.getElementById('row-index').value = res.rowIndex;
        document.getElementById('status-badge-container').style.display = 'block';
        const statusBadge = document.getElementById('status-display');
        let foundTxt = res.foundMonth ? ` (พบใน: ${res.foundMonth})` : '';
        statusBadge.innerText = 'สถานะ: ' + res.status + foundTxt;
        
        if (res.status === 'รอดำเนินการ') { statusBadge.className = 'badge rounded-pill bg-danger fs-6 px-4 py-2 shadow-sm'; document.getElementById('save-btn').className = 'btn btn-success w-100 mt-4 py-3 fw-bold rounded-pill shadow'; document.getElementById('save-btn').innerHTML = '<i class="bi bi-cloud-arrow-up"></i> บันทึกส่งงาน'; } 
        else if (res.status === 'เสร็จสมบูรณ์') { statusBadge.className = 'badge rounded-pill bg-success fs-6 px-4 py-2 shadow-sm'; document.getElementById('save-btn').className = 'btn btn-secondary w-100 mt-4 py-3 fw-bold rounded-pill shadow'; document.getElementById('save-btn').innerText = 'ปิดใบสั่งเรียบร้อยแล้ว (แก้ไขได้)'; } 
        else { statusBadge.className = 'badge rounded-pill bg-warning text-dark fs-6 px-4 py-2 shadow-sm'; document.getElementById('save-btn').className = 'btn btn-primary w-100 mt-4 py-3 fw-bold rounded-pill shadow'; document.getElementById('save-btn').innerHTML = '<i class="bi bi-pencil-square"></i> อัปเดตข้อมูล'; }
        
        if(res.foundMonth) document.getElementById('month-select').value = res.foundMonth;
        renderFormUI(res.data, 'ucube');
      });
    }

    function renderFormUI(dataArray, mode) {
      let fieldsHtml = '';
      for (let i = 0; i < globalHeaders.length; i++) {
        let title = globalHeaders[i] || `คอลัมน์ ${i+1}`; let val = dataArray[i] || ''; let isReadOnly = (mode === 'ucube' && (i === 0 || i === 1)) ? 'readonly' : ''; 
        if (i === 7) { fieldsHtml += `<div class="mb-3"><label class="form-label text-secondary fw-bold">${title}</label><input type="text" class="form-control p-2" id="col-${i}" list="details-list" value="${val}"></div>`; } 
        else if (i === 10) { fieldsHtml += `<div class="mb-3"><label class="form-label text-secondary fw-bold">${title}</label><input type="text" class="form-control p-2" id="col-${i}" list="operator-list" value="${val}"></div>`; } 
        else if (i === 8 || i === 9) { let directUrl = getDirectImageUrl(val); let imgPreview = val && val.startsWith('http') ? `<img src="${directUrl}" class="image-preview" style="display:block;">` : `<img id="preview-${i}" class="image-preview">`; fieldsHtml += `<div class="mb-3 p-3" style="background: rgba(0,0,0,0.03); border-radius: 12px;"><label class="form-label text-secondary fw-bold"><i class="bi bi-camera"></i> ${title}</label><input type="file" class="form-control mb-2" accept="image/*" onchange="handleFileUpload(event, ${i})"><input type="hidden" id="col-${i}" value="${val}">${imgPreview}</div>`; } 
        else { fieldsHtml += `<div class="mb-3"><label class="form-label text-secondary fw-bold">${title}</label><input type="text" class="form-control p-2" id="col-${i}" value="${val}" ${isReadOnly}></div>`; }
      }
      document.getElementById('dynamic-fields').innerHTML = fieldsHtml; document.getElementById('form-container').style.display = 'block';
    }

    function handleFileUpload(event, index) {
      const file = event.target.files[0]; if (!file) return;
      const reader = new FileReader(); reader.onload = function(e) { document.getElementById(`col-${index}`).value = e.target.result; let preview = document.getElementById(`preview-${index}`); if(preview) { preview.src = e.target.result; preview.style.display = 'block'; } }; reader.readAsDataURL(file);
    }

    // 🚀 เพิ่ม Dialog ถามยืนยันก่อนบันทึกส่งงาน
    function saveData() {
      if (!confirm("⚠️ ยืนยันการบันทึกส่งงานสับเปลี่ยนมิเตอร์ ใช่หรือไม่?")) return;

      const btn = document.getElementById('save-btn'); btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> กำลังบันทึก...'; btn.disabled = true;
      const mode = document.getElementById('work-mode').value; const month = document.getElementById('month-select').value; const rowIndex = document.getElementById('row-index').value;
      let formData = []; for (let i = 0; i < globalHeaders.length; i++) { formData.push(document.getElementById(`col-${i}`).value); }

      callAPI('saveData', { mode: mode, month: month, rowIndex: rowIndex, formData: formData }, function(res) {
        btn.disabled = false;
        if(res.success) {
          alert('บันทึกข้อมูลเรียบร้อยแล้ว!');
          if(mode === 'general') { document.getElementById('work-mode').value = 'ucube'; toggleWorkMode(); } 
          else { document.getElementById('status-display').innerText = 'สถานะ: ส่งงานแล้ว'; document.getElementById('status-display').className = 'badge rounded-pill bg-warning text-dark fs-6 px-4 py-2 shadow-sm'; btn.className = 'btn btn-primary w-100 mt-4 py-3 fw-bold rounded-pill shadow'; btn.innerHTML = '<i class="bi bi-pencil-square"></i> อัปเดตข้อมูล'; }
          if(res.updatedMonth) document.getElementById('filter-month').value = res.updatedMonth;
          loadDashboard(); 
        } else { alert('ผิดพลาด: ' + res.message); btn.innerText = 'ลองใหม่'; }
      });
    }

    function processPendingWork(peaOrName, sheetName) {
      const searchTab = document.querySelector('#search-tab'); bootstrap.Tab.getOrCreateInstance(searchTab).show();
      setTimeout(() => { document.getElementById('work-mode').value = 'ucube'; toggleWorkMode(); document.getElementById('month-select').value = sheetName || "ALL"; document.getElementById('search-query').value = peaOrName; searchData(); }, 300); 
    }

    function filterDashboard() {
      let input = document.getElementById('dash-search').value.toLowerCase();
      const items = document.querySelectorAll('.dash-item'); 
      let isExactMatch = false;
      if (input.startsWith('"') && input.endsWith('"')) { isExactMatch = true; input = input.substring(1, input.length - 1); }
      const searchTerms = input.split(/\s+/).filter(k => k.length > 0);

      items.forEach(item => {
        const text = item.innerText.toLowerCase();
        if (isExactMatch) {
            if (text.includes(input)) item.style.setProperty('display', 'block', 'important'); else item.style.setProperty('display', 'none', 'important');
        } else {
            const isMatch = searchTerms.every(term => text.includes(term));
            if (isMatch) item.style.setProperty('display', 'block', 'important'); else item.style.setProperty('display', 'none', 'important');
        }
      });
    }

    function updateRouteCount() {
      const checkboxes = document.querySelectorAll('.route-cb:checked'); const count = checkboxes.length; const panel = document.getElementById('route-panel');
      document.getElementById('route-count').innerText = count;
      if(count > 0) panel.style.display = 'block'; else panel.style.display = 'none';
    }

    function startRouting() {
      const checkboxes = document.querySelectorAll('.route-cb:checked'); if (checkboxes.length === 0) return;
      let url = "https://www.google.com/maps/dir/Current+Location/"; let hasUrlError = false;
      checkboxes.forEach(cb => {
        if(cb.value && cb.value.trim() !== '') {
           let cleanGps = cb.value.trim(); 
           if(cleanGps.toLowerCase().includes("http") || cleanGps.toLowerCase().includes("goo.gl")) hasUrlError = true;
           else { cleanGps = cleanGps.replace(/\s/g, ''); url += cleanGps + "/"; }
        }
      });
      if (hasUrlError) { alert("⚠️ พิกัดบางอันเป็นลิงก์ (URL) ระบบนำทางหลายจุดรองรับเฉพาะรูปแบบ ละติจูด,ลองจิจูด เท่านั้น รบกวนแก้ใน Google Sheets ครับ"); return; }
      window.open(url, '_blank');
    }

    function viewCompletedWork(encodedItem) {
      const item = JSON.parse(decodeURIComponent(encodedItem));
      currentOrderRow = item.rowIndex; currentOrderSheetName = item.sheetName; 

      let directPic1 = getDirectImageUrl(item.pic1); let directPic2 = getDirectImageUrl(item.pic2);
      let pic1Html = item.pic1 && item.pic1.startsWith('http') ? `<a href="${item.pic1}" target="_blank"><img src="${directPic1}" class="detail-img shadow-sm"></a>` : '<div class="text-muted small border p-4 rounded bg-light">ไม่มีภาพถ่ายหลัก</div>';
      let pic2Html = item.pic2 && item.pic2.startsWith('http') ? `<a href="${item.pic2}" target="_blank"><img src="${directPic2}" class="detail-img shadow-sm"></a>` : '<div class="text-muted small border p-4 rounded bg-light">ไม่มีภาพถ่ายรอง</div>';

      let html = `
        <div class="p-2 modal-custom-text">
          <div class="row mb-3"><div class="col-12"><span class="fw-bold me-2 text-primary">ชื่อ</span> : ${item.name || '-'}</div></div>
          <div class="row mb-3"><div class="col-6"><span class="fw-bold me-2 text-primary">PEA.เดิม</span> : ${item.pea || '-'}</div><div class="col-6"><span class="fw-bold me-2 text-primary">หน่วย</span> : ${item.colD || '-'}</div></div>
          <div class="row mb-3"><div class="col-6"><span class="fw-bold me-2 text-primary">PEA.ใหม่</span> : ${item.colF || '-'}</div><div class="col-6"><span class="fw-bold me-2 text-primary">หน่วย</span> : ${item.colG || '-'}</div></div>
          <div class="row mb-4"><div class="col-6"><span class="fw-bold me-2 text-primary">สาเหตุ</span> : ${item.reason || '-'}</div><div class="col-6"><span class="fw-bold me-2 text-primary">ผู้ดำเนินงาน</span> : ${item.operator || '-'}</div></div>
          <div class="row text-center mt-2"><div class="col-6"><p class="fw-bold mb-2">ภาพถ่ายหลัก</p>${pic1Html}</div><div class="col-6"><p class="fw-bold mb-2">ภาพถ่ายรอง</p>${pic2Html}</div></div>
          ${item.timestamp ? `<div class="mt-3 text-center"><span class="badge bg-secondary rounded-pill py-2 px-3 shadow-sm">ส่งงานเมื่อ: ${item.timestamp}</span></div>` : ''}
        </div>
      `;
      document.getElementById('orderModalBody').innerHTML = html;
      new bootstrap.Modal(document.getElementById('orderModal')).show();
    }

    // 🚀 เพิ่ม Dialog ถามยืนยันก่อนปิดใบสั่ง
    function submitCloseOrder() {
      if (!confirm("⚠️ ยืนยันการปิดใบสั่งงานนี้ ใช่หรือไม่?")) return;

      const btn = document.getElementById('btn-close-order'); btn.innerText = 'กำลังประมวลผล...'; btn.disabled = true;
      callAPI('closeOrder', { sheetName: currentOrderSheetName, currentOrderRow: currentOrderRow }, function(res) {
        btn.innerText = 'ปิดใบสั่ง'; btn.disabled = false;
        if(res.success) { bootstrap.Modal.getInstance(document.getElementById('orderModal')).hide(); loadDashboard(); } else { alert('ผิดพลาด: ' + res.message); }
      });
    }

    function loadDashboard() {
      const month = document.getElementById('filter-month').value; const statusFilter = document.getElementById('filter-status').value;
      if(!month) return; 
      document.getElementById('dash-search').value = ''; document.getElementById('dash-loader').style.display = 'block'; document.getElementById('dashboard-list').innerHTML = ''; document.getElementById('route-panel').style.display = 'none';

      callAPI('getDashboardData', { month: month, statusFilter: statusFilter }, function(res) {
        document.getElementById('dash-loader').style.display = 'none';
        globalDashResults = res.results; // 🚀 เก็บเข้าตัวแปรเผื่อใช้สร้างตาราง
        
        // 🚀 อัปเดตสถิติทั้ง 5 กล่อง
        document.getElementById('stat-total').innerText = res.stats.total; 
        document.getElementById('stat-pending').innerText = res.stats.pending; 
        document.getElementById('stat-contractor').innerText = res.stats.contractor; 
        document.getElementById('stat-emp').innerText = res.stats.employee; 
        document.getElementById('stat-completed').innerText = res.stats.completed;

        let html = '';
        if(res.results.length === 0) { html = '<div class="alert alert-secondary text-center rounded-pill">ไม่พบรายการงาน</div>'; } 
        else {
          res.results.forEach(item => {
            let actionHtml = '';
            if (item.status === 'งานคงเหลือ') { actionHtml = `<button class="btn btn-sm btn-outline-danger fw-bold w-100 mt-3 rounded-pill" onclick="processPendingWork('${item.pea}', '${item.sheetName}')">คลิกเข้าดำเนินการ (งานคงเหลือ)</button>`; } 
            else if (item.status === 'ผู้รับเหมาส่งงานแล้ว' || item.status === 'พนง. ดำเนินการแล้ว') { actionHtml = `<button class="btn btn-sm btn-warning text-dark fw-bold w-100 mt-3 shadow-sm rounded-pill" onclick="viewCompletedWork('${encodeURIComponent(JSON.stringify(item))}')">ตรวจสอบ / ปิดใบสั่ง</button>`; } 
            else if (item.status === 'เสร็จสมบูรณ์') { actionHtml = `<div class="bg-success text-white text-center w-100 p-2 mt-3 fs-6 shadow-sm rounded-pill"><i class="bi bi-check-circle-fill"></i> เสร็จสมบูรณ์แล้ว</div>`; }

            let gpsBadgeHtml = item.gps && item.gps.trim() !== '' ? `<span class="badge bg-info text-dark ms-2 shadow-sm border border-light"><i class="bi bi-geo-alt-fill text-danger"></i> พิกัด</span>` : '';
            let checkboxHtml = item.gps && item.gps.trim() !== '' ? `<input class="form-check-input route-cb me-3 fs-4 shadow-sm border-secondary" type="checkbox" value="${item.gps}" onchange="updateRouteCount()">` : '';
            
            // 🚀 โชว์ป้ายกำกับสถานะใน List ด้วย
            let statusBadgeList = '';
            if(item.status === 'ผู้รับเหมาส่งงานแล้ว') statusBadgeList = '<span class="badge bg-warning text-dark float-end">ผรม.ส่งงาน</span>';
            if(item.status === 'พนง. ดำเนินการแล้ว') statusBadgeList = '<span class="badge" style="background:#9b59b6; float:end;">พนง.ส่งงาน</span>';

            html += `
              <div class="list-group-item mb-3 rounded-4 shadow-sm border-0 dash-item" style="background: rgba(255,255,255,0.85); backdrop-filter: blur(5px);">
                <div class="d-flex align-items-center mb-2 border-bottom pb-2">
                  ${checkboxHtml}
                  <h6 class="mb-0 fw-bold text-primary flex-grow-1"><i class="bi bi-person-badge"></i> PEA: ${item.pea || '-'} ${gpsBadgeHtml} ${statusBadgeList}</h6>
                </div>
                <div class="text-muted small mb-1 ps-2"><strong>ชื่อ:</strong> ${item.name || '-'} <br><strong>สถานที่:</strong> ${item.location || '-'} <br><strong class="text-danger">สาเหตุ:</strong> ${item.reason || '-'}</div>
                ${actionHtml}
              </div>
            `;
          });
        }
        document.getElementById('dashboard-list').innerHTML = html;
      });
    }

    // 🚀 ฟังก์ชันใหม่: สร้างตารางและเปิด Modal เมื่อคลิกกล่องสถิติ
    function showTableModal(filterStatus) {
      document.getElementById('tableModalTitle').innerText = `รายละเอียดสถานะ: ${filterStatus}`;
      let thead = ''; let tbody = '';
      
      // กรองข้อมูลตามสถานะที่คลิก (ถ้าคลิก "ทั้งหมด" ให้เอาหมดเลย)
      let filteredData = (filterStatus === 'ทั้งหมด') ? globalDashResults : globalDashResults.filter(item => item.status === filterStatus);
      
      if (filteredData.length === 0) {
          document.getElementById('tableModalHead').innerHTML = '';
          document.getElementById('tableModalBody').innerHTML = '<tr><td class="text-center py-4">ไม่มีข้อมูลในสถานะนี้ครับบอส</td></tr>';
          new bootstrap.Modal(document.getElementById('tableModal')).show();
          return;
      }

      // 3.1 ปุ่มงานคงเหลือ โชว์ PEA /ชื่อ /สถานที่ /สาเหตุ
      if (filterStatus === 'งานคงเหลือ' || filterStatus === 'ทั้งหมด') {
        thead = `<tr><th>PEA</th><th>ชื่อ</th><th>สถานที่</th><th>สาเหตุ</th>${filterStatus==='ทั้งหมด'?'<th>สถานะ</th>':''}</tr>`;
        filteredData.forEach(item => {
           tbody += `<tr><td>${item.pea}</td><td>${item.name}</td><td>${item.location}</td><td>${item.reason}</td>${filterStatus==='ทั้งหมด'?`<td>${item.status}</td>`:''}</tr>`;
        });
      } 
      // 3.2 ปุ่มส่งงาน โชว์ PEAเก่า/ชื่อ/สถานที่/สาเหตุ/หน่วยเก่า/PEAใหม่/หน่วยใหม่/ผู้ดำเนินการ/วันที่
      else if (filterStatus === 'ผู้รับเหมาส่งงานแล้ว' || filterStatus === 'พนง. ดำเนินการแล้ว') {
        thead = `<tr><th>PEA เก่า</th><th>ชื่อ</th><th>สถานที่</th><th>สาเหตุ</th><th>หน่วย PEA เก่า</th><th>PEA ใหม่</th><th>หน่วย PEA ใหม่</th><th>ผู้ดำเนินการ</th><th>วันที่ดำเนินการ</th></tr>`;
        filteredData.forEach(item => {
           tbody += `<tr><td>${item.pea}</td><td>${item.name}</td><td>${item.location}</td><td>${item.reason}</td><td class="text-center">${item.colD}</td><td>${item.colF}</td><td class="text-center">${item.colG}</td><td class="text-center">${item.operator}</td><td>${item.timestamp}</td></tr>`;
        });
      }
      // 3.3 ปุ่มเสร็จสมบูรณ์ โชว์ ชื่อ/ PEAเก่า/ PEAใหม่ /สาเหตุ/ ผู้ดำเนินการ /วันที่ปิดใบสั่ง
      else if (filterStatus === 'เสร็จสมบูรณ์') {
        thead = `<tr><th>ชื่อ</th><th>PEA เก่า</th><th>PEA ใหม่</th><th>สาเหตุ</th><th>ผู้ดำเนินการ</th><th>วันที่ปิดใบสั่ง</th></tr>`;
        filteredData.forEach(item => {
           tbody += `<tr><td>${item.name}</td><td>${item.pea}</td><td>${item.colF}</td><td>${item.reason}</td><td class="text-center">${item.operator}</td><td>${item.closeTime || '-'}</td></tr>`;
        });
      }

      document.getElementById('tableModalHead').innerHTML = thead;
      document.getElementById('tableModalBody').innerHTML = tbody;
      new bootstrap.Modal(document.getElementById('tableModal')).show();
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition; const recognition = SpeechRecognition ? new SpeechRecognition() : null;
    if(recognition) {
      recognition.lang = 'th-TH'; recognition.interimResults = false; recognition.maxAlternatives = 1;
      recognition.onstart = function() { document.getElementById('jarvis-btn').classList.add('listening'); window.speechSynthesis.cancel(); };
      recognition.onresult = function(event) { processVoiceCommand(event.results[0][0].transcript); };
      recognition.onerror = function(event) { document.getElementById('jarvis-btn').classList.remove('listening'); };
      recognition.onend = function() { document.getElementById('jarvis-btn').classList.remove('listening'); };
    }
    function toggleJarvis() { if(!recognition) { alert("เบราว์เซอร์ไม่รองรับครับ"); return; } document.getElementById('jarvis-btn').classList.add('listening'); try { recognition.start(); } catch(e) {} }
    function speak(text) { if('speechSynthesis' in window) { const msg = new SpeechSynthesisUtterance(text); msg.lang = 'th-TH'; msg.rate = 1.1; window.speechSynthesis.speak(msg); } }

    function processVoiceCommand(text) {
      let keyword = text.replace(/ช่วย/g, '').replace(/กรอง/g, '').replace(/หา/g, '').replace(/ค้นหา/g, '').replace(/ใบงาน/g, '').replace(/ที่อยู่/g, '').replace(/ในโซน/g, '').replace(/ให้หน่อย/g, '').replace(/หน่อย/g, '').replace(/ครับ/g, '').replace(/ค่ะ/g, '').replace(/สิ/g, '').trim();
      keyword = keyword.replace(/กับ|และ|เว้นวรรค/g, ' ');
      const knownReasons = ["ช็อตไหม้", "น้ำเข้า", "ผ้ามัว", "ไม่หมุน", "ติดขัด", "ชำรุด", "ขั้วต่อ"];
      knownReasons.forEach(reason => { if (keyword.includes(reason)) { keyword = keyword.replace(new RegExp(reason, 'g'), ' ' + reason + ' '); } });
      keyword = keyword.replace(/\s+/g, ' ').trim();
      if(keyword === "") return;
      const statusTab = document.querySelector('#status-tab'); bootstrap.Tab.getOrCreateInstance(statusTab).show();
      const searchBox = document.getElementById('dash-search'); searchBox.value = keyword; filterDashboard(); 
      setTimeout(() => {
        const items = document.querySelectorAll('.dash-item'); let count = 0;
        items.forEach(item => { if (item.style.getPropertyValue('display') !== 'none') count++; });
        let reply = count > 0 ? `พบ ${count} ใบงานที่เกี่ยวข้องกับ ${keyword} ครับบอส` : `ไม่พบใบงานเกี่ยวกับ ${keyword} เลยครับ`; speak(reply);
      }, 350); 
    }
  </script>
</body>
