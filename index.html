<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบรับ-ส่งงาน เปลี่ยนมิเตอร์</title>
  <!-- PWA Settings -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3f2b96">
  <link rel="apple-touch-icon" href="1000002294.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <style>
    /* ==========================================
       🌟 GLASSMORPHISM & WARM THEME CSS
       ========================================== */
    body { 
      /* พื้นหลังไล่สีโทนอุ่น สบายตา */
      background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
      background-attachment: fixed;
      font-family: 'Sarabun', sans-serif; 
      color: #333;
    }
    
    .container { max-width: 800px; margin-top: 20px; padding-bottom: 80px; }
    
    /* สไตล์กล่องกระจก (Glass Card) */
    .glass-card {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 16px;
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
      padding: 25px;
      margin-bottom: 20px;
    }

    /* ตกแต่ง Input Form ให้เข้ากับกระจก */
    .form-control, .form-select {
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(200, 200, 200, 0.5);
      border-radius: 10px;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
    }
    .form-control:focus, .form-select:focus {
      background: #fff;
      border-color: #a8c0ff;
      box-shadow: 0 0 8px rgba(168, 192, 255, 0.6);
    }

    /* ตกแต่ง Tabs */
    .nav-tabs { border-bottom: none; justify-content: center; gap: 10px; margin-bottom: 15px; }
    .nav-tabs .nav-link {
      border: none;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 30px;
      color: #666;
      padding: 10px 25px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
    .nav-tabs .nav-link.active {
      background: linear-gradient(135deg, #a8c0ff 0%, #3f2b96 100%);
      color: #fff;
      font-weight: bold;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(63, 43, 150, 0.3);
    }

    /* ตกแต่งโลโก้ */
    .app-logo {
      max-height: 140px;
      border-radius: 20px;
      filter: drop-shadow(0 10px 15px rgba(0,0,0,0.15));
      margin-bottom: 15px;
    }
    .app-title {
      font-weight: 800;
      background: -webkit-linear-gradient(45deg, #3f2b96, #a8c0ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.05);
    }

    /* Stat Cards กระจก */
    .stat-card {
      border-radius: 15px;
      color: #fff;
      text-align: center;
      padding: 15px;
      margin-bottom: 10px;
      border: 1px solid rgba(255,255,255,0.4);
      backdrop-filter: blur(5px);
    }
    .bg-total { background: linear-gradient(135deg, rgba(52, 152, 219, 0.8), rgba(41, 128, 185, 0.9)); box-shadow: 0 4px 15px rgba(52,152,219,0.3); }
    .bg-pending { background: linear-gradient(135deg, rgba(231, 76, 60, 0.8), rgba(192, 57, 43, 0.9)); box-shadow: 0 4px 15px rgba(231,76,60,0.3); }
    .bg-done { background: linear-gradient(135deg, rgba(243, 156, 18, 0.8), rgba(211, 84, 0, 0.9)); box-shadow: 0 4px 15px rgba(243,156,18,0.3); }
    .bg-completed { background: linear-gradient(135deg, rgba(46, 204, 113, 0.8), rgba(39, 174, 96, 0.9)); box-shadow: 0 4px 15px rgba(46,204,113,0.3); }

    /* ปุ่มและโหลดเดอร์ */
    .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 5px 15px rgba(118, 75, 162, 0.4); }
    .loader { display: none; margin: 10px auto; border: 4px solid #f3f3f3; border-radius: 50%; border-top: 4px solid #764ba2; width: 35px; height: 35px; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    
    .image-preview { max-width: 100%; height: auto; margin-top: 10px; border-radius: 12px; display: none; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .detail-img { width: 100%; object-fit: cover; border-radius: 12px; border: 1px solid #ddd; max-height: 400px; }

    /* 🤖 J.A.R.V.I.S Floating Button (ไฮเทคเหมือนเดิม) */
    .jarvis-fab { position: fixed; bottom: 30px; right: 30px; width: 65px; height: 65px; border-radius: 50%; background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); color: #00d2ff; border: 2px solid #00d2ff; box-shadow: 0 0 15px rgba(0, 210, 255, 0.5); font-size: 28px; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 1050; transition: all 0.3s ease; }
    .jarvis-fab:hover { transform: scale(1.1); box-shadow: 0 0 25px rgba(0, 210, 255, 0.8); }
    .jarvis-fab.listening { animation: pulse-ring 1.5s infinite; background: linear-gradient(135deg, #8a2387, #e94057, #f27121); border-color: #fff; color: #fff; box-shadow: 0 0 25px rgba(233, 64, 87, 0.8); }
    @keyframes pulse-ring { 0% { box-shadow: 0 0 0 0 rgba(233, 64, 87, 0.7); } 70% { box-shadow: 0 0 0 20px rgba(233, 64, 87, 0); } 100% { box-shadow: 0 0 0 0 rgba(233, 64, 87, 0); } }
  </style>
</head>
<body>

  <!-- ปุ่มไมค์ J.A.R.V.I.S -->
  <button id="jarvis-btn" class="jarvis-fab" onclick="toggleJarvis()" title="กดเพื่อสั่งการด้วยเสียง">
    <i class="bi bi-mic-fill"></i>
  </button>

  <datalist id="details-list">
    <option value="ชำรุด/ไม่หมุน/ติดขัด"><option value="ช็อตไหม้"><option value="LCD ไม่แสดงค่า">
    <option value="ขั้วต่อสายชำรุด"><option value="น้ำเข้า"><option value="ชำรุด / ผ้ามัว">
    <option value="แป้นผุ/คว่ำเอียง/ไม่หมุน">
  </datalist>
  <datalist id="operator-list"><option value="ผรม."><option value="พนง.ผมต."></datalist>

  <div class="container">
    
    <!-- ส่วนหัวแอป และ โลโก้ -->
    <div class="text-center mb-4 mt-2">
      <!-- รูปโลโก้ เรียกใช้ไฟล์ที่อัปโหลด -->
      <img src="1000002294.png" alt="PEA Meter Logo" class="app-logo">
      <h2 class="app-title mt-2">ระบบรับ-ส่งงาน เปลี่ยนมิเตอร์</h2>
      <p class="text-muted small">PEA Smart Operation by J.A.R.V.I.S</p>
    </div>
    
    <ul class="nav nav-tabs" id="myTab" role="tablist">
      <li class="nav-item" role="presentation"><button class="nav-link active" id="search-tab" data-bs-toggle="tab" data-bs-target="#search-panel" type="button">ส่งงาน ส.ป.มิเตอร์</button></li>
      <li class="nav-item" role="presentation"><button class="nav-link" id="status-tab" data-bs-toggle="tab" data-bs-target="#status-panel" type="button">สถานะใบงาน</button></li>
    </ul>

    <div class="tab-content mt-3">
      <!-- แท็บ: ส่งงาน -->
      <div class="tab-pane fade show active" id="search-panel" role="tabpanel">
        <div class="glass-card">
          <label class="form-label fw-bold text-secondary">รูปแบบการส่งงาน:</label>
          <select id="work-mode" class="form-select mb-3" onchange="toggleWorkMode()">
            <option value="ucube">1. จากใบงาน UCUBE</option>
            <option value="general">2. ส.ป.มิเตอร์ ทั่วไป</option>
          </select>

          <div id="search-section">
            <label class="form-label fw-bold text-secondary">เลือกเดือน (แผ่นงาน):</label>
            <select id="month-select" class="form-select mb-3"></select>
            
            <label class="form-label fw-bold text-secondary">ค้นหาใบงาน:</label>
            <div class="input-group">
              <input type="text" id="search-query" class="form-control" placeholder="ระบุ PEA หรือ ชื่อผู้ใช้ไฟฟ้า">
              <button class="btn btn-primary px-4" onclick="searchData()"><i class="bi bi-search"></i> ค้นหา</button>
            </div>
          </div>
        </div>

        <div id="search-loader" class="loader"></div>
        
        <div id="form-container" style="display:none;">
          <div class="text-center mb-3" id="status-badge-container">
            <span id="status-display" class="badge rounded-pill fs-6 px-4 py-2 shadow-sm"></span>
          </div>
          <form id="data-form" class="glass-card">
            <input type="hidden" id="row-index">
            <div id="dynamic-fields"></div>
            <button type="button" id="save-btn" class="btn btn-success w-100 mt-4 py-3 fw-bold rounded-pill shadow" onclick="saveData()">
              <i class="bi bi-cloud-arrow-up"></i> บันทึกส่งงาน
            </button>
          </form>
        </div>
      </div>

      <!-- แท็บ: สถานะใบงาน -->
      <div class="tab-pane fade" id="status-panel" role="tabpanel">
        <div class="glass-card">
          <div class="row">
            <div class="col-6">
              <label class="form-label fw-bold text-secondary">สถานะ:</label>
              <select id="filter-status" class="form-select" onchange="loadDashboard()">
                <option value="ทั้งหมด" selected>ทั้งหมด</option>
                <option value="ส่งงานแล้ว">ส่งงานแล้ว</option>
                <option value="งานคงเหลือ">งานคงเหลือ</option>
                <option value="เสร็จสมบูรณ์">เสร็จสมบูรณ์</option>
              </select>
            </div>
            <div class="col-6">
              <label class="form-label fw-bold text-secondary">ประจำเดือน:</label>
              <select id="filter-month" class="form-select" onchange="loadDashboard()"></select>
            </div>
          </div>
          <div class="mt-4">
            <input type="text" id="dash-search" class="form-control rounded-pill px-4" placeholder="🔍 ค้นหา PEA, ชื่อ, สถานที่..." onkeyup="filterDashboard()">
          </div>
        </div>
        
        <div id="dash-loader" class="loader"></div>
        
        <div class="row flex-column-reverse flex-md-row">
          <div class="col-md-8">
            <div class="list-group" id="dashboard-list"></div>
          </div>
          <div class="col-md-4 mb-3">
            <div class="row">
              <div class="col-6 col-md-12"><div class="stat-card bg-total"><h6 class="mb-1 text-white-50">ใบงานทั้งหมด</h6><h3 id="stat-total" class="fw-bold mb-0">0</h3></div></div>
              <div class="col-6 col-md-12"><div class="stat-card bg-pending"><h6 class="mb-1 text-white-50">คงเหลือ</h6><h3 id="stat-pending" class="fw-bold mb-0">0</h3></div></div>
              <div class="col-6 col-md-12"><div class="stat-card bg-done"><h6 class="mb-1 text-white-50">ส่งงานแล้ว</h6><h3 id="stat-done" class="fw-bold mb-0">0</h3></div></div>
              <div class="col-6 col-md-12"><div class="stat-card bg-completed"><h6 class="mb-1 text-white-50">เสร็จสมบูรณ์</h6><h3 id="stat-completed" class="fw-bold mb-0">0</h3></div></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal ปิดใบสั่ง -->
  <div class="modal fade" id="orderModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content glass-card border-0" style="background: rgba(255, 255, 255, 0.95);">
        <div class="modal-header border-bottom">
          <h5 class="modal-title fw-bold text-primary"><i class="bi bi-clipboard-check"></i> ตรวจสอบข้อมูลเพื่อปิดใบสั่ง</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="orderModalBody"></div>
        <div class="modal-footer border-top">
          <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">ยกเลิก</button>
          <button type="button" class="btn btn-success rounded-pill px-5 fw-bold shadow" id="btn-close-order" onclick="submitCloseOrder()">ปิดใบสั่ง</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // 🚀 ลงทะเบียน Service Worker สำหรับ PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('✅ Service Worker ลงทะเบียนสำเร็จ!'))
          .catch(err => console.error('❌ Service Worker ล้มเหลว:', err));
      });
    }
    // 🌐 ลิงก์ Web App API 
    const API_URL = "https://script.google.com/macros/s/AKfycbxV5LU6BkYkodydL4g8ajf6jxZVACRxXOARt7K0poJ08RLT8YIbSzNiJdcOIP6WB62g/exec";

    let globalHeaders = [];
    let currentOrderRow = null; 

    function callAPI(action, params, onSuccess) {
      fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, 
        body: JSON.stringify({ action: action, params: params })
      })
      .then(response => response.json())
      .then(data => onSuccess(data))
      .catch(error => {
        console.error('API Error:', error);
        alert('เกิดข้อผิดพลาดในการเชื่อมต่อกับเซิร์ฟเวอร์');
        document.getElementById('search-loader').style.display = 'none';
        document.getElementById('dash-loader').style.display = 'none';
        if(document.getElementById('save-btn')) {
           document.getElementById('save-btn').disabled = false;
           document.getElementById('save-btn').innerHTML = '<i class="bi bi-cloud-arrow-up"></i> บันทึกส่งงาน';
        }
      });
    }

    window.onload = function() {
      callAPI('getInitialData', {}, initApp);
    }

    function initApp(res) {
      globalHeaders = res.headers;
      const monthSelect = document.getElementById('month-select');
      const filterMonth = document.getElementById('filter-month');
      res.months.forEach(month => {
        monthSelect.add(new Option(month, month));
        filterMonth.add(new Option(month, month));
      });
      loadDashboard();
    }

    function getDirectImageUrl(url) {
      if (!url) return '';
      let match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
      if (match && match[1]) {
        return 'https://drive.google.com/thumbnail?id=' + match[1] + '&sz=w1000';
      }
      return url; 
    }

    function toggleWorkMode() {
      const mode = document.getElementById('work-mode').value;
      if (mode === 'general') {
        document.getElementById('search-section').style.display = 'none';
        document.getElementById('status-badge-container').style.display = 'none';
        renderFormUI(new Array(globalHeaders.length).fill(''), 'general');
        document.getElementById('save-btn').className = 'btn btn-success w-100 mt-4 py-3 fw-bold rounded-pill shadow';
        document.getElementById('save-btn').innerHTML = '<i class="bi bi-cloud-arrow-up"></i> บันทึกส่งงาน';
      } else {
        document.getElementById('search-section').style.display = 'block';
        document.getElementById('form-container').style.display = 'none';
      }
    }

    function searchData() {
      const month = document.getElementById('month-select').value;
      const query = document.getElementById('search-query').value.trim();
      if(!query) { alert('กรุณาระบุข้อมูลสำหรับค้นหา'); return; }
      
      document.getElementById('search-loader').style.display = 'block';
      document.getElementById('form-container').style.display = 'none';
      
      callAPI('searchWork', { month: month, query: query }, function(res) {
        document.getElementById('search-loader').style.display = 'none';
        if (!res.success) { alert(res.message); return; }
        
        document.getElementById('row-index').value = res.rowIndex;
        document.getElementById('status-badge-container').style.display = 'block';
        
        const statusBadge = document.getElementById('status-display');
        statusBadge.innerText = 'สถานะ: ' + res.status;
        
        if (res.status === 'รอดำเนินการ') {
          statusBadge.className = 'badge rounded-pill bg-danger fs-6 px-4 py-2 shadow-sm';
          document.getElementById('save-btn').className = 'btn btn-success w-100 mt-4 py-3 fw-bold rounded-pill shadow';
          document.getElementById('save-btn').innerHTML = '<i class="bi bi-cloud-arrow-up"></i> บันทึกส่งงาน';
        } else if (res.status === 'เสร็จสมบูรณ์') {
          statusBadge.className = 'badge rounded-pill bg-success fs-6 px-4 py-2 shadow-sm';
          document.getElementById('save-btn').className = 'btn btn-secondary w-100 mt-4 py-3 fw-bold rounded-pill shadow';
          document.getElementById('save-btn').innerText = 'ปิดใบสั่งเรียบร้อยแล้ว (แก้ไขได้)';
        } else {
          statusBadge.className = 'badge rounded-pill bg-warning text-dark fs-6 px-4 py-2 shadow-sm';
          document.getElementById('save-btn').className = 'btn btn-primary w-100 mt-4 py-3 fw-bold rounded-pill shadow';
          document.getElementById('save-btn').innerHTML = '<i class="bi bi-pencil-square"></i> อัปเดตข้อมูล';
        }
        renderFormUI(res.data, 'ucube');
      });
    }

    function renderFormUI(dataArray, mode) {
      let fieldsHtml = '';
      for (let i = 0; i < globalHeaders.length; i++) {
        let title = globalHeaders[i] || `คอลัมน์ ${i+1}`;
        let val = dataArray[i] || '';
        let isReadOnly = (mode === 'ucube' && (i === 0 || i === 1)) ? 'readonly' : ''; 
        
        if (i === 7) { 
          fieldsHtml += `<div class="mb-3"><label class="form-label text-secondary fw-bold">${title}</label><input type="text" class="form-control p-2" id="col-${i}" list="details-list" value="${val}"></div>`;
        } else if (i === 10) { 
          fieldsHtml += `<div class="mb-3"><label class="form-label text-secondary fw-bold">${title}</label><input type="text" class="form-control p-2" id="col-${i}" list="operator-list" value="${val}"></div>`;
        } else if (i === 8 || i === 9) { 
          let directUrl = getDirectImageUrl(val); 
          let imgPreview = val && val.startsWith('http') ? `<img src="${directUrl}" class="image-preview" style="display:block;">` : `<img id="preview-${i}" class="image-preview">`;
          fieldsHtml += `<div class="mb-3 p-3" style="background: rgba(0,0,0,0.03); border-radius: 12px;"><label class="form-label text-secondary fw-bold"><i class="bi bi-camera"></i> ${title}</label><input type="file" class="form-control mb-2" accept="image/*" onchange="handleFileUpload(event, ${i})"><input type="hidden" id="col-${i}" value="${val}">${imgPreview}</div>`;
        } else { 
          fieldsHtml += `<div class="mb-3"><label class="form-label text-secondary fw-bold">${title}</label><input type="text" class="form-control p-2" id="col-${i}" value="${val}" ${isReadOnly}></div>`;
        }
      }
      document.getElementById('dynamic-fields').innerHTML = fieldsHtml;
      document.getElementById('form-container').style.display = 'block';
    }

    function handleFileUpload(event, index) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById(`col-${index}`).value = e.target.result;
        let preview = document.getElementById(`preview-${index}`);
        if(preview) { preview.src = e.target.result; preview.style.display = 'block'; }
      };
      reader.readAsDataURL(file);
    }

    function saveData() {
      const btn = document.getElementById('save-btn');
      btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> กำลังบันทึกข้อมูล...';
      btn.disabled = true;

      const mode = document.getElementById('work-mode').value;
      const month = document.getElementById('month-select').value;
      const rowIndex = document.getElementById('row-index').value;
      
      let formData = [];
      for (let i = 0; i < globalHeaders.length; i++) {
        formData.push(document.getElementById(`col-${i}`).value);
      }

      callAPI('saveData', { mode: mode, month: month, rowIndex: rowIndex, formData: formData }, function(res) {
        btn.disabled = false;
        if(res.success) {
          alert('บันทึกข้อมูลเรียบร้อยแล้ว!');
          if(mode === 'general') {
             document.getElementById('work-mode').value = 'ucube';
             toggleWorkMode();
          } else {
             document.getElementById('status-display').innerText = 'สถานะ: ส่งงานแล้ว';
             document.getElementById('status-display').className = 'badge rounded-pill bg-warning text-dark fs-6 px-4 py-2 shadow-sm';
             btn.className = 'btn btn-primary w-100 mt-4 py-3 fw-bold rounded-pill shadow';
             btn.innerHTML = '<i class="bi bi-pencil-square"></i> อัปเดตข้อมูล';
          }
          loadDashboard(); 
        } else {
          alert('เกิดข้อผิดพลาด: ' + res.message);
          btn.innerText = 'ลองใหม่';
        }
      });
    }

    function processPendingWork(peaOrName) {
      const searchTab = document.querySelector('#search-tab');
      bootstrap.Tab.getOrCreateInstance(searchTab).show();
      setTimeout(() => {
        document.getElementById('work-mode').value = 'ucube';
        toggleWorkMode();
        document.getElementById('search-query').value = peaOrName;
        searchData();
      }, 250); 
    }

    function filterDashboard() {
      const input = document.getElementById('dash-search').value.toLowerCase();
      const items = document.querySelectorAll('.dash-item'); 
      items.forEach(item => {
        const text = item.innerText.toLowerCase();
        if (text.includes(input)) {
          item.style.setProperty('display', 'block', 'important');
        } else {
          item.style.setProperty('display', 'none', 'important');
        }
      });
    }

    function viewCompletedWork(encodedItem) {
      const item = JSON.parse(decodeURIComponent(encodedItem));
      currentOrderRow = item.rowIndex;

      let directPic1 = getDirectImageUrl(item.pic1);
      let directPic2 = getDirectImageUrl(item.pic2);

      let pic1Html = item.pic1 && item.pic1.startsWith('http') ? `<a href="${item.pic1}" target="_blank"><img src="${directPic1}" class="detail-img shadow-sm" onerror="this.onerror=null; this.src='https://placehold.co/400x500/eeeeee/999999?text=Image+Error'"></a>` : '<div class="text-muted small border p-4 rounded bg-light">ไม่มีภาพถ่ายหลัก</div>';
      let pic2Html = item.pic2 && item.pic2.startsWith('http') ? `<a href="${item.pic2}" target="_blank"><img src="${directPic2}" class="detail-img shadow-sm" onerror="this.onerror=null; this.src='https://placehold.co/400x500/eeeeee/999999?text=Image+Error'"></a>` : '<div class="text-muted small border p-4 rounded bg-light">ไม่มีภาพถ่ายรอง</div>';

      let html = `
        <div class="p-2 modal-custom-text">
          <div class="row mb-3"><div class="col-12"><span class="fw-bold me-2 text-primary">ชื่อผู้ใช้ไฟฟ้า</span> : ${item.name || '-'}</div></div>
          <div class="row mb-3"><div class="col-6"><span class="fw-bold me-2 text-primary">PEA.No.เดิม</span> : ${item.pea || '-'}</div><div class="col-6"><span class="fw-bold me-2 text-primary">หน่วย</span> : ${item.colD || '-'}</div></div>
          <div class="row mb-3"><div class="col-6"><span class="fw-bold me-2 text-primary">PEA.No.ใหม่</span> : ${item.colF || '-'}</div><div class="col-6"><span class="fw-bold me-2 text-primary">หน่วย</span> : ${item.colG || '-'}</div></div>
          <div class="row mb-4"><div class="col-6"><span class="fw-bold me-2 text-primary">สาเหตุ</span> : ${item.reason || '-'}</div><div class="col-6"><span class="fw-bold me-2 text-primary">ผู้ดำเนินการ</span> : ${item.operator || '-'}</div></div>
          <div class="row text-center mt-2"><div class="col-6"><p class="fw-bold mb-2">ภาพถ่ายหลัก</p>${pic1Html}</div><div class="col-6"><p class="fw-bold mb-2">ภาพถ่ายรอง</p>${pic2Html}</div></div>
        </div>
      `;
      document.getElementById('orderModalBody').innerHTML = html;
      new bootstrap.Modal(document.getElementById('orderModal')).show();
    }

    function submitCloseOrder() {
      const btn = document.getElementById('btn-close-order');
      btn.innerText = 'กำลังประมวลผล...';
      btn.disabled = true;

      const month = document.getElementById('filter-month').value;
      callAPI('closeOrder', { month: month, currentOrderRow: currentOrderRow }, function(res) {
        btn.innerText = 'ปิดใบสั่ง';
        btn.disabled = false;
        if(res.success) {
          bootstrap.Modal.getInstance(document.getElementById('orderModal')).hide();
          loadDashboard(); 
        } else {
          alert('ผิดพลาด: ' + res.message);
        }
      });
    }

    function loadDashboard() {
      const month = document.getElementById('filter-month').value;
      const statusFilter = document.getElementById('filter-status').value;
      if(!month) return; 
      
      document.getElementById('dash-search').value = '';
      document.getElementById('dash-loader').style.display = 'block';
      document.getElementById('dashboard-list').innerHTML = '';

      callAPI('getDashboardData', { month: month, statusFilter: statusFilter }, function(res) {
        document.getElementById('dash-loader').style.display = 'none';
        
        document.getElementById('stat-total').innerText = res.stats.total;
        document.getElementById('stat-done').innerText = res.stats.done;
        document.getElementById('stat-pending').innerText = res.stats.pending;
        document.getElementById('stat-completed').innerText = res.stats.completed;

        let html = '';
        if(res.results.length === 0) {
          html = '<div class="alert alert-secondary text-center rounded-pill">ไม่พบรายการงาน</div>';
        } else {
          res.results.forEach(item => {
            let actionHtml = '';
            if (item.status === 'งานคงเหลือ') {
               actionHtml = `<button class="btn btn-sm btn-outline-danger fw-bold w-100 mt-3 rounded-pill" onclick="processPendingWork('${item.pea}')">ดำเนินการเปลี่ยนมิเตอร์</button>`;
            } else if (item.status === 'ส่งงานแล้ว') {
               let encoded = encodeURIComponent(JSON.stringify(item));
               actionHtml = `<button class="btn btn-sm btn-warning text-dark fw-bold w-100 mt-3 shadow-sm rounded-pill" onclick="viewCompletedWork('${encoded}')">ตรวจสอบ / ปิดใบสั่ง</button>`;
            } else if (item.status === 'เสร็จสมบูรณ์') {
               actionHtml = `<div class="bg-success text-white text-center w-100 p-2 mt-3 fs-6 shadow-sm rounded-pill"><i class="bi bi-check-circle-fill"></i> เสร็จสมบูรณ์</div>`;
            }

            html += `
              <div class="list-group-item mb-3 rounded-4 shadow-sm border-0 dash-item" style="background: rgba(255,255,255,0.85); backdrop-filter: blur(5px);">
                <div class="d-flex justify-content-between"><h6 class="mb-2 fw-bold text-primary"><i class="bi bi-person-badge"></i> PEA: ${item.pea || '-'}</h6></div>
                <div class="text-muted small mb-1"><strong>ชื่อ:</strong> ${item.name || '-'} <br><strong>สถานที่:</strong> ${item.location || '-'} <br><strong class="text-danger">สาเหตุ:</strong> ${item.reason || '-'}</div>
                ${actionHtml}
              </div>
            `;
          });
        }
        document.getElementById('dashboard-list').innerHTML = html;
      });
    }

    // ==========================================
    // 🤖 J.A.R.V.I.S VOICE ASSISTANT SYSTEM
    // ==========================================
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = SpeechRecognition ? new SpeechRecognition() : null;
    
    if(recognition) {
      recognition.lang = 'th-TH'; 
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      recognition.onstart = function() {
        document.getElementById('jarvis-btn').classList.add('listening');
        window.speechSynthesis.cancel(); 
      };

      recognition.onresult = function(event) {
        const transcript = event.results[0][0].transcript;
        console.log("J.A.R.V.I.S ได้ยินว่า: ", transcript);
        processVoiceCommand(transcript);
      };

      recognition.onerror = function(event) {
        console.error("Speech error: ", event.error);
        document.getElementById('jarvis-btn').classList.remove('listening');
        if (event.error === 'not-allowed' || event.error === 'audio-capture') {
           alert("⚠️ บอสต้องกด 'อนุญาต (Allow)' ให้เบราว์เซอร์เข้าถึงไมโครโฟนก่อนนะครับ");
        }
      };

      recognition.onend = function() {
        document.getElementById('jarvis-btn').classList.remove('listening');
      };
    }

    function toggleJarvis() {
      const btn = document.getElementById('jarvis-btn');
      if(!recognition) {
        alert("เบราว์เซอร์นี้ไม่รองรับระบบสั่งงานด้วยเสียง แนะนำให้ใช้ Google Chrome หรือ Safari ครับบอส");
        return;
      }
      btn.classList.add('listening');
      try { recognition.start(); } catch(e) {}
    }

    function speak(text) {
      if('speechSynthesis' in window) {
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'th-TH';
        msg.rate = 1.1; 
        window.speechSynthesis.speak(msg);
      }
    }

    function processVoiceCommand(text) {
      let keyword = text.replace(/ช่วย/g, '').replace(/กรอง/g, '').replace(/หา/g, '').replace(/ค้นหา/g, '').replace(/ใบงาน/g, '').replace(/ที่อยู่/g, '').replace(/ในโซน/g, '').replace(/ให้หน่อย/g, '').replace(/หน่อย/g, '').replace(/ครับ/g, '').replace(/ค่ะ/g, '').replace(/สิ/g, '').trim();
      if(keyword === "") keyword = text.trim();

      const statusTab = document.querySelector('#status-tab');
      bootstrap.Tab.getOrCreateInstance(statusTab).show();

      const searchBox = document.getElementById('dash-search');
      searchBox.value = keyword;
      filterDashboard(); 

      setTimeout(() => {
        const items = document.querySelectorAll('.dash-item');
        let count = 0;
        items.forEach(item => { if (item.style.getPropertyValue('display') !== 'none') count++; });

        let reply = "";
        if (count > 0) {
          const successReplies = [
            `เรียบร้อยครับบอส เจอใบงานที่ตรงกับ ${keyword} ทั้งหมด ${count} รายการ`,
            `ค้นหาเสร็จสิ้น พบข้อมูล ${keyword} จำนวน ${count} ใบงานครับ`,
            `จัดให้ครับ พบ ${count} ใบงานที่ตรงกับ ${keyword}`
          ];
          reply = successReplies[Math.floor(Math.random() * successReplies.length)];
        } else {
          const failReplies = [
            `ผมตรวจสอบแล้ว ไม่พบข้อมูลของ ${keyword} ในเดือนนี้เลยครับบอส`,
            `ไม่มีใบงาน ${keyword} ในระบบตอนนี้ครับ`
          ];
          reply = failReplies[Math.floor(Math.random() * failReplies.length)];
        }
        speak(reply);
      }, 350); 
    }
  </script>
