      // [หมวด 4] วิเคราะห์รายการสำคัญ / งานด่วน (รองรับเทียบเดือนนี้กับเดือนที่แล้ว)
      isImportantItem(item) {
        const sheet = (item.sheetName || '').toLowerCase();
        const reason = (item.reason || '').toLowerCase();
        return sheet.includes('ด่วน') || reason.includes('ช็อตไหม้') || /ครั้งที่\s*[2-9]/.test(reason);
      }

      analyzeImportantWork(isCompareMonths) {
        this.ensureData(isCompareMonths, (allData) => {
          if (isCompareMonths) {
            const monthSheets = [...new Set(allData.map(i => i.sheetName))]
              .filter(name => /^\d{2}\.\d{4}$/.test(name))
              .sort((a, b) => {
                const [mA, yA] = a.split('.').map(Number);
                const [mB, yB] = b.split('.').map(Number);
                return (yB * 100 + mB) - (yA * 100 + mA);
              });

            const now = new Date();
            const curKey = `${String(now.getMonth() + 1).padStart(2, '0')}.${now.getFullYear() + 543}`;
            const prevDate = new Date(now.getFullYear(), now.getMonth() - 1, 1);
            const prevKey = `${String(prevDate.getMonth() + 1).padStart(2, '0')}.${prevDate.getFullYear() + 543}`;

            const thisM = monthSheets.includes(curKey) ? curKey : (monthSheets[0] || curKey);
            const lastM = (monthSheets.includes(prevKey) && thisM === curKey) ? prevKey : (monthSheets.find(m => m !== thisM) || prevKey);

            const impThis = allData.filter(i => i.sheetName === thisM && this.isImportantItem(i));
            const impLast = allData.filter(i => i.sheetName === lastM && this.isImportantItem(i));
            const pendingThis = impThis.filter(i => i.status === 'งานคงเหลือ');

            this.promptChoices(
              `สรุปรายการสำคัญครับบอส รอบเดือน <b>${thisM}</b> มี <b>${impThis.length} ราย</b> (คงเหลือ ${pendingThis.length} ราย) ส่วนเดือนก่อนหน้า <b>${lastM}</b> มี <b>${impLast.length} ราย</b> ครับ ต้องการเปิดดูรายการสำคัญของ <b>เดือนนี้ (${thisM})</b> หรือ <b>เดือนที่แล้ว (${lastM})</b> ครับ?`,
              [
                {
                  label: `เดือนนี้ ${thisM} (${impThis.length})`,
                  icon: '📅',
                  priority: 1,
                  keywords: ['เดือนนี้', 'ปัจจุบัน', thisM],
                  handler: () => {
                    this.displayCustomListOnDashboard(impThis, `รายการสำคัญรอบเดือน ${thisM}`);
                    this.speak(`แสดงรายการสำคัญรอบเดือน ${thisM} จำนวน ${impThis.length} รายการ เรียบร้อยครับบอส`, false);
                  }
                },
                {
                  label: `เดือนที่แล้ว ${lastM} (${impLast.length})`,
                  icon: '🗓️',
                  priority: 1,
                  keywords: ['เดือนที่แล้ว', 'เดือนก่อน', 'ที่แล้ว', lastM],
                  handler: () => {
                    this.displayCustomListOnDashboard(impLast, `รายการสำคัญรอบเดือน ${lastM}`);
                    this.speak(`แสดงรายการสำคัญรอบเดือน ${lastM} จำนวน ${impLast.length} รายการ เรียบร้อยครับบอส`, false);
                  }
                }
              ],
              () => {
                const both = [...impThis, ...impLast];
                this.displayCustomListOnDashboard(both, `รายการสำคัญรวม (${thisM} และ ${lastM})`);
                this.speak(`แสดงรายการสำคัญรวมทั้ง 2 เดือน จำนวน ${both.length} รายการ เรียบร้อยครับบอส`, false);
              }
            );
          } else {
            const impAll = allData.filter(i => this.isImportantItem(i));
            const impPending = impAll.filter(i => i.status === 'งานคงเหลือ');

            this.promptChoices(
              `พบรายการสำคัญและงานด่วนทั้งหมด <b>${impAll.length} รายการ</b> และยังเป็น <b>งานคงเหลือ ${impPending.length} รายการ</b> ครับบอส ต้องการเปิดดูเฉพาะ <b>งานสำคัญที่ยังค้าง</b> หรือ <b>รายการสำคัญทั้งหมด</b> ครับ?`,
              [
                {
                  label: `สำคัญที่ยังค้าง (${impPending.length})`,
                  icon: '⏳',
                  priority: 2,
                  keywords: ['ค้าง', 'คงเหลือ', 'ยังไม่เสร็จ'],
                  handler: () => {
                    this.displayCustomListOnDashboard(impPending, 'รายการสำคัญ / งานด่วน ที่ยังคงเหลือ');
                    this.speak(`แสดงรายการสำคัญที่ยังค้าง ${impPending.length} รายการ เรียบร้อยครับบอส`, false);
                  }
                },
                {
                  label: `สำคัญทั้งหมด (${impAll.length})`,
                  icon: '🔥',
                  priority: 1,
                  keywords: ['สำคัญทั้งหมด', 'ทั้งหมด', 'ทุกสถานะ'],
                  handler: () => {
                    this.displayCustomListOnDashboard(impAll, 'รายการสำคัญ / งานด่วน / งานค้างซ้ำ ทั้งหมด');
                    this.speak(`แสดงรายการสำคัญทั้งหมด ${impAll.length} รายการ เรียบร้อยครับบอส`, false);
                  }
                }
              ]
            );
          }
        });
      }

      // [หมวด 5] วิเคราะห์รายการซ้ำข้ามเดือน
      analyzeCrossMonthDuplicates() {
        this.speak("กำลังตรวจสอบหมายเลข PEA ที่ซ้ำกันระหว่างเดือนนี้กับเดือนที่แล้ว รอสักครู่ครับบอส", false);
        this.ensureData(true, (allData) => {
          const monthSheets = [...new Set(allData.map(i => i.sheetName))]
            .filter(name => /^\d{2}\.\d{4}$/.test(name))
            .sort((a, b) => {
              const [mA, yA] = a.split('.').map(Number);
              const [mB, yB] = b.split('.').map(Number);
              return (yB * 100 + mB) - (yA * 100 + mA);
            });

          if (monthSheets.length < 2) {
            this.resetConversation();
            this.speak("ในระบบมีข้อมูลชีตเดือนไม่ถึง 2 เดือน จึงยังไม่สามารถเทียบรายการซ้ำข้ามเดือนได้ครับบอส", false);
            return;
          }

          const now = new Date();
          const curKey = `${String(now.getMonth() + 1).padStart(2, '0')}.${now.getFullYear() + 543}`;
          const prevDate = new Date(now.getFullYear(), now.getMonth() - 1, 1);
          const prevKey = `${String(prevDate.getMonth() + 1).padStart(2, '0')}.${prevDate.getFullYear() + 543}`;

          const targetThisMonth = monthSheets.includes(curKey) ? curKey : monthSheets[0];
          const targetLastMonth = (monthSheets.includes(prevKey) && targetThisMonth === curKey)
            ? prevKey
            : monthSheets.find(m => m !== targetThisMonth);

          const thisPeas = new Set(allData.filter(i => i.sheetName === targetThisMonth && i.pea && i.pea !== '-').map(i => i.pea.trim()));
          const lastPeas = new Set(allData.filter(i => i.sheetName === targetLastMonth && i.pea && i.pea !== '-').map(i => i.pea.trim()));
          const dupPeas = [...thisPeas].filter(pea => lastPeas.has(pea));

          if (dupPeas.length === 0) {
            this.resetConversation();
            this.speak(`ตรวจสอบแล้วครับบอส ระหว่างรอบเดือน <b>${targetThisMonth}</b> กับ <b>${targetLastMonth}</b> ไม่มีหมายเลข PEA ซ้ำกันเลยครับ`, false);
            return;
          }

          const dupSet = new Set(dupPeas);
          const matchedRows = allData
            .filter(i => (i.sheetName === targetThisMonth || i.sheetName === targetLastMonth) && dupSet.has((i.pea || '').trim()))
            .sort((a, b) => String(a.pea).localeCompare(String(b.pea)));

          const pendingDupRows = matchedRows.filter(i => i.status === 'งานคงเหลือ');
          const pendingNote = pendingDupRows.length > 0
            ? `และในกลุ่มนี้ยังมีสถานะ <b>งานคงเหลือ</b> ค้างอยู่ ${pendingDupRows.length} รายการครับ`
            : `ซึ่งทั้งหมดถูกดำเนินการส่งงานเรียบร้อยแล้วครับ`;

          if (pendingDupRows.length > 0) {
            this.promptChoices(
              `พบหมายเลข PEA ซ้ำกันระหว่างรอบเดือน <b>${targetThisMonth}</b> กับ <b>${targetLastMonth}</b> จำนวน <b>${dupPeas.length} ราย</b> ครับบอส ${pendingNote} ต้องการเปิดดูเฉพาะ <b>รายการซ้ำที่ยังค้าง</b> หรือ <b>คู่ที่ซ้ำทั้งหมด</b> ครับ?`,
              [
                {
                  label: `ซ้ำที่ยังค้าง (${pendingDupRows.length})`,
                  icon: '⏳',
                  priority: 2,
                  keywords: ['ค้าง', 'คงเหลือ', 'ยังไม่เสร็จ'],
                  handler: () => {
                    this.displayCustomListOnDashboard(pendingDupRows, `รายการ PEA ซ้ำที่ยังค้าง (${targetThisMonth} vs ${targetLastMonth})`);
                    this.speak(`แสดงรายการซ้ำที่ยังค้าง ${pendingDupRows.length} รายการ บนหน้าจอเรียบร้อยครับบอส`, false);
                  }
                },
                {
                  label: `คู่ที่ซ้ำทั้งหมด (${matchedRows.length})`,
                  icon: '🔁',
                  priority: 1,
                  keywords: ['ทั้งหมด', 'คู่ที่ซ้ำ', 'ซ้ำทั้งหมด'],
                  handler: () => {
                    this.displayCustomListOnDashboard(matchedRows, `รายการ PEA ซ้ำกันทั้งหมด (${targetThisMonth} vs ${targetLastMonth})`);
                    this.speak(`แสดงคู่รายการที่ซ้ำทั้งหมด ${matchedRows.length} รายการ บนหน้าจอเรียบร้อยครับบอส`, false);
                  }
                }
              ]
            );
          } else {
            this.promptChoices(
              `พบหมายเลข PEA ซ้ำกันระหว่างรอบเดือน <b>${targetThisMonth}</b> กับ <b>${targetLastMonth}</b> จำนวน <b>${dupPeas.length} ราย</b> ครับบอส ${pendingNote} ต้องการเปิดดู <b>คู่ที่ซ้ำทั้งหมดบนหน้าจอ</b> หรือ <b>กลับไปดูภาพรวม</b> ครับ?`,
              [
                {
                  label: `คู่ที่ซ้ำทั้งหมด (${matchedRows.length})`,
                  icon: '🔁',
                  priority: 2,
                  keywords: ['ซ้ำ', 'ทั้งหมด', 'เปิดดู'],
                  handler: () => {
                    this.displayCustomListOnDashboard(matchedRows, `รายการ PEA ซ้ำกัน (${targetThisMonth} vs ${targetLastMonth})`);
                    this.speak(`แสดงรายการที่ซ้ำทั้งหมด ${matchedRows.length} รายการ บนหน้าจอเรียบร้อยครับบอส`, false);
                  }
                },
                {
                  label: 'สรุปภาพรวมงาน',
                  icon: '📊',
                  priority: 1,
                  keywords: ['ภาพรวม', 'สรุป'],
                  handler: () => this.analyzeAndSummarize()
                }
              ]
            );
          }
        });
      }

      // [หมวด 6] วิเคราะห์สาเหตุการชำรุดยอดฮิต (เสนอทั้ง อันดับ 1 vs อันดับ 2)
      analyzeTopReasons() {
        this.ensureData(false, (all) => {
          const counts = {};
          all.forEach(i => {
            const r = (i.reason || 'ไม่ระบุสาเหตุ').trim();
            counts[r] = (counts[r] || 0) + 1;
          });
          const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
          if (sorted.length === 0) {
            this.speak("ยังไม่มีข้อมูลสาเหตุการชำรุดให้วิเคราะห์ครับบอส", false);
            return;
          }

          const top1 = sorted[0];
          const top2 = sorted[1] || null;
          const top1Items = all.filter(i => (i.reason || 'ไม่ระบุสาเหตุ').trim() === top1[0]);

          if (top2) {
            const top2Items = all.filter(i => (i.reason || 'ไม่ระบุสาเหตุ').trim() === top2[0]);
            this.promptChoices(
              `สาเหตุที่พบมากที่สุดอันดับ 1 คือ <b>${top1[0]}</b> (${top1[1]} ราย) รองลงมาอันดับ 2 คือ <b>${top2[0]}</b> (${top2[1]} ราย) ครับบอส ต้องการกรองดูสาเหตุ <b>${top1[0]}</b> หรือ <b>${top2[0]}</b> บนหน้าจอครับ?`,
              [
                {
                  label: `${top1[0]} (${top1[1]})`,
                  icon: '1️⃣',
                  priority: 2,
                  keywords: [top1[0].toLowerCase(), 'อันดับ 1', 'อันดับหนึ่ง'],
                  handler: () => {
                    this.displayCustomListOnDashboard(top1Items, `กรองตามสาเหตุ: ${top1[0]}`);
                    this.speak(`แสดงรายการสาเหตุ ${top1[0]} จำนวน ${top1Items.length} รายการ บนหน้าจอเรียบร้อยครับบอส`, false);
                  }
                },
                {
                  label: `${top2[0]} (${top2[1]})`,
                  icon: '2️⃣',
                  priority: 1,
                  keywords: [top2[0].toLowerCase(), 'อันดับ 2', 'อันดับสอง'],
                  handler: () => {
                    this.displayCustomListOnDashboard(top2Items, `กรองตามสาเหตุ: ${top2[0]}`);
                    this.speak(`แสดงรายการสาเหตุ ${top2[0]} จำนวน ${top2Items.length} รายการ บนหน้าจอเรียบร้อยครับบอส`, false);
                  }
                }
              ],
              () => {
                const combined = [...top1Items, ...top2Items];
                this.displayCustomListOnDashboard(combined, `สาเหตุยอดฮิต 2 อันดับ (${top1[0]} + ${top2[0]})`);
                this.speak(`แสดงรายการทั้ง 2 สาเหตุรวม ${combined.length} รายการ บนหน้าจอเรียบร้อยครับบอส`, false);
              }
            );
          } else {
            this.promptChoices(
              `สาเหตุที่พบมากที่สุดคือ <b>${top1[0]}</b> จำนวน <b>${top1[1]} ราย</b> ครับบอส ต้องการ <b>กรองแสดงเฉพาะสาเหตุนี้</b> หรือ <b>ดูรายการทั้งหมด</b> ครับ?`,
              [
                {
                  label: `เฉพาะ ${top1[0]} (${top1[1]})`,
                  icon: '🔧',
                  priority: 2,
                  keywords: [top1[0].toLowerCase(), 'กรอง', 'เฉพาะ'],
                  handler: () => {
                    this.displayCustomListOnDashboard(top1Items, `กรองตามสาเหตุ: ${top1[0]}`);
                    this.speak(`แสดงรายการสาเหตุ ${top1[0]} เรียบร้อยครับบอส`, false);
                  }
                },
                {
                  label: `รายการทั้งหมด (${all.length})`,
                  icon: '📋',
                  priority: 1,
                  keywords: ['ทั้งหมด'],
                  handler: () => {
                    this.displayCustomListOnDashboard(all, 'รายการทั้งหมด');
                    this.speak(`แสดงรายการทั้งหมด ${all.length} รายการ เรียบร้อยครับบอส`, false);
                  }
                }
              ]
            );
          }
        });
      }

      // [หมวด 7] แนะนำจุดเริ่มงาน & จัดเส้นทาง GPS (เสนอทั้ง เปิดแผนที่นำทาง vs โชว์รายการพื้นที่นี้)
      recommendBestRoute() {
        this.ensureData(false, (all) => {
          const pendingWithGps = all.filter(i => i.status === 'งานคงเหลือ' && this.hasValidNumericGps(i));
          if (pendingWithGps.length === 0) {
            this.speak("ตอนนี้ไม่มีงานคงเหลือที่มีพิกัดตัวเลขพร้อมนำทางครับบอส", false);
            return;
          }
          const areaCount = {};
          pendingWithGps.forEach(item => {
            const loc = (item.location || 'ไม่ระบุ').trim();
            areaCount[loc] = (areaCount[loc] || 0) + 1;
          });
          const bestArea = Object.entries(areaCount).sort((a, b) => b[1] - a[1])[0];
          const bestItems = pendingWithGps.filter(i => (i.location || '').trim() === bestArea[0]);

          this.promptChoices(
            `ผมวิเคราะห์แล้ว แนะนำให้เริ่มที่พื้นที่ <b>${bestArea[0]}</b> ก่อนครับ เพราะมีงานคงเหลือพร้อมพิกัดกระจุกตัวมากที่สุด <b>${bestArea[1]} ใบงาน</b> ต้องการ <b>เปิด Google Maps นำทาง</b> หรือ <b>โชว์รายการพื้นที่นี้บนหน้าจอ</b> ครับ?`,
            [
              {
                label: `เปิดแผนที่นำทาง (${bestItems.length} จุด)`,
                icon: '🧭',
                priority: 2,
                keywords: ['แผนที่', 'นำทาง', 'gps', 'google maps', 'เปิดแมพ'],
                handler: () => {
                  this.speak(`กำลังเปิด Google Maps นำทางไปยังพื้นที่ ${bestArea[0]} จำนวน ${bestItems.length} จุดครับบอส`, false);
                  this.executeMapRouting(bestItems);
                }
              },
              {
                label: `โชว์รายการพื้นที่ ${bestArea[0]}`,
                icon: '📋',
                priority: 1,
                keywords: ['โชว์', 'รายการ', 'หน้าจอ', 'ดูรายละเอียด'],
                handler: () => {
                  this.displayCustomListOnDashboard(bestItems, `งานคงเหลือพื้นที่แนะนำ: ${bestArea[0]}`);
                  this.speak(`แสดงรายการพื้นที่ ${bestArea[0]} จำนวน ${bestItems.length} ใบงาน บนหน้าจอเรียบร้อยครับบอส`, false);
                }
              }
            ]
          );
        });
      }

      // [หมวด 8] เช็กความพร้อมพิกัด GPS (เสนอครบทั้ง ไม่มีพิกัด vs มีพิกัดพร้อมลุย)
      analyzeGpsReadiness() {
        this.ensureData(false, (all) => {
          const pending = all.filter(i => i.status === 'งานคงเหลือ');
          const validGps = pending.filter(i => this.hasValidNumericGps(i));
          const urlGps = pending.filter(i => i.gps && (i.gps.toLowerCase().includes('http') || i.gps.toLowerCase().includes('goo.gl')));
          const missingGps = pending.filter(i => !i.gps || i.gps.trim() === '');
          const noReadyGps = [...missingGps, ...urlGps];

          const urlWarn = urlGps.length > 0 ? ` (รวม ${urlGps.length} งานที่พิกัดยังเป็นลิงก์ URL)` : '';

          this.promptChoices(
            `ตรวจสอบความพร้อมพิกัดจากงานคงเหลือ <b>${pending.length} งาน</b> ครับบอส: มีพิกัดตัวเลขพร้อมลุย <b>${validGps.length} งาน</b> และยังไม่มีพิกัด/ต้องแก้ไข <b>${noReadyGps.length} งาน</b>${urlWarn} ต้องการเปิดดูรายการที่ <b>ไม่มีพิกัด</b> หรือรายการที่ <b>มีพิกัดพร้อมลุย</b> ครับ?`,
            [
              {
                label: `ไม่มีพิกัด/ต้องแก้ (${noReadyGps.length})`,
                icon: '⚠️',
                priority: 2, // สำคัญกว่าเพื่อจับคำว่า "ไม่มีพิกัด" ก่อน "มีพิกัด"
                keywords: ['ไม่มีพิกัด', 'ขาดพิกัด', 'ยังไม่ลงพิกัด', 'ต้องแก้', 'ไม่มี'],
                handler: () => {
                  this.displayCustomListOnDashboard(noReadyGps, 'งานคงเหลือที่ยังไม่มีพิกัด / พิกัดเป็นลิงก์ URL');
                  this.speak(`แสดงรายการที่ยังไม่มีพิกัดจำนวน ${noReadyGps.length} รายการ บนหน้าจอเรียบร้อยครับบอส`, false);
                }
              },
              {
                label: `มีพิกัดพร้อมลุย (${validGps.length})`,
                icon: '📍',
                priority: 1,
                keywords: ['มีพิกัด', 'พร้อมลุย', 'พร้อมนำทาง', 'พร้อม', 'มี'],
                handler: () => {
                  this.displayCustomListOnDashboard(validGps, 'งานคงเหลือที่มีพิกัดตัวเลขพร้อมนำทาง');
                  this.speak(`แสดงรายการที่มีพิกัดพร้อมลุยจำนวน ${validGps.length} รายการ บนหน้าจอเรียบร้อยครับบอส`, false);
                }
              }
            ],
            () => {
              this.displayCustomListOnDashboard(pending, 'งานคงเหลือทั้งหมด (มีพิกัด + ไม่มีพิกัด)');
              this.speak(`แสดงงานคงเหลือทั้งหมด ${pending.length} รายการ บนหน้าจอเรียบร้อยครับบอส`, false);
            }
          );
        });
      }

      // [หมวด 9] ค้นหาเจาะจง + เสนอทางเลือก 2 ฝั่ง
      performSearchAndThink(keyword, isFollowUp) {
        const statusTab = document.querySelector('#status-tab');
        if (statusTab) bootstrap.Tab.getOrCreateInstance(statusTab).show();
        
        const searchBox = document.getElementById('dash-search');
        if (searchBox) {
          searchBox.value = keyword;
          filterDashboard();
        }

        const terms = keyword.toLowerCase().split(/\s+/);
        const matched = (globalDashResults || []).filter(item => {
          const fullText = `${item.pea} ${item.name} ${item.location} ${item.reason} ${item.status} ${item.sheetName}`.toLowerCase();
          return terms.every(t => fullText.includes(t));
        });

        this.state.lastMatchedItems = matched;

        if (matched.length === 0) {
          this.resetConversation();
          this.speak(`ไม่พบใบงานที่ตรงกับ "${keyword}" เลยครับบอส ลองระบุชื่อพื้นที่หรือสาเหตุอื่นดูไหมครับ?`, false);
        } else if (matched.length === 1) {
          const item = matched[0];
          const isPending = item.status === 'งานคงเหลือ';
          const primaryLabel = isPending ? 'เปิดฟอร์มส่งงาน' : 'เปิดตรวจสอบ/ปิดใบสั่ง';
          const primaryHandler = () => {
            if (isPending) {
              this.speak(`กำลังเปิดแบบฟอร์มใบงาน PEA ${item.pea} ให้ครับบอส`, false);
              processPendingWork(item.pea, item.sheetName);
            } else {
              this.speak(`กำลังเปิดหน้าต่างตรวจสอบใบงาน PEA ${item.pea} ให้ครับบอส`, false);
              viewCompletedWork(encodeURIComponent(JSON.stringify(item)));
            }
          };

          if (this.hasValidNumericGps(item)) {
            this.promptChoices(
              `พบ 1 ใบงานครับบอส PEA <b>${item.pea}</b> คุณ${item.name} สถานะ <b>${item.status}</b> ต้องการ <b>${primaryLabel}</b> หรือ <b>เปิดแผนที่นำทาง GPS</b> เลยครับ?`,
              [
                {
                  label: primaryLabel,
                  icon: '📝',
                  priority: 1,
                  keywords: ['ฟอร์ม', 'ส่งงาน', 'ตรวจสอบ', 'ปิดใบสั่ง', 'รายละเอียด', 'เปิดใบงาน'],
                  handler: primaryHandler
                },
                {
                  label: 'เปิดแผนที่นำทาง GPS',
                  icon: '🗺️',
                  priority: 2,
                  keywords: ['แผนที่', 'นำทาง', 'พิกัด', 'gps'],
                  handler: () => {
                    this.speak(`กำลังเปิดแผนที่นำทางไปยัง PEA ${item.pea} ครับบอส`, false);
                    this.executeMapRouting([item]);
                  }
                }
              ]
            );
          } else {
            this.promptChoices(
              `พบ 1 ใบงานครับบอส PEA <b>${item.pea}</b> คุณ${item.name} สถานะ <b>${item.status}</b> ต้องการ <b>${primaryLabel}</b> หรือ <b>ดูรายการบนหน้าจอ</b> ครับ?`,
              [
                {
                  label: primaryLabel,
                  icon: '📝',
                  priority: 2,
                  keywords: ['ฟอร์ม', 'ส่งงาน', 'ตรวจสอบ', 'ปิดใบสั่ง', 'เปิดใบงาน'],
                  handler: primaryHandler
                },
                {
                  label: 'ดูรายการบนหน้าจอ',
                  icon: '📋',
                  priority: 1,
                  keywords: ['หน้าจอ', 'รายการ', 'ไม่ต้อง'],
                  handler: () => this.speak(`แสดงข้อมูล PEA ${item.pea} บนหน้าจอเรียบร้อยครับบอส`, false)
                }
              ]
            );
          }
        } else if (matched.length > 10 && !isFollowUp) {
          const pendingInMatch = matched.filter(m => m.status === 'งานคงเหลือ');
          this.promptChoices(
            `พบถึง <b>${matched.length} ใบงาน</b> ครับบอส ค่อนข้างเยอะเลย ต้องการกรองเฉพาะ <b>งานคงเหลือ (${pendingInMatch.length})</b> หรือ <b>แสดงทั้งหมด (${matched.length})</b> ครับ?`,
            [
              {
                label: `เฉพาะงานคงเหลือ (${pendingInMatch.length})`,
                icon: '⏳',
                priority: 2,
                keywords: ['งานคงเหลือ', 'คงเหลือ', 'ค้าง'],
                handler: () => {
                  this.displayCustomListOnDashboard(pendingInMatch, `ค้นหา "${keyword}" (เฉพาะงานคงเหลือ)`);
                  this.speak(`กรองเฉพาะงานคงเหลือจำนวน ${pendingInMatch.length} ใบงาน เรียบร้อยครับบอส`, false);
                }
              },
              {
                label: `แสดงทั้งหมด (${matched.length})`,
                icon: '📋',
                priority: 1,
                keywords: ['ทั้งหมด', 'ทุกสถานะ'],
                handler: () => this.speak(`แสดงทั้งหมด ${matched.length} ใบงาน บนหน้าจอเรียบร้อยครับบอส`, false)
              }
            ]
          );
        } else {
          const withGps = matched.filter(m => this.hasValidNumericGps(m) && m.status === 'งานคงเหลือ');
          if (withGps.length > 0 && withGps.length <= 9) {
            this.promptChoices(
              `พบ <b>${matched.length} ใบงาน</b> ครับ และมี <b>${withGps.length} งานคงเหลือ</b> ที่มีพิกัดพร้อมนำทาง ต้องการ <b>เปิดแผนที่นำทาง</b> หรือ <b>ดูรายการบนหน้าจอ</b> ครับ?`,
              [
                {
                  label: `เปิดแผนที่นำทาง (${withGps.length} จุด)`,
                  icon: '🧭',
                  priority: 2,
                  keywords: ['แผนที่', 'นำทาง', 'gps', 'เปิดแมพ'],
                  handler: () => {
                    this.speak(`กำลังเปิดแผนที่นำทางทั้ง ${withGps.length} จุดครับบอส`, false);
                    this.executeMapRouting(withGps);
                  }
                },
                {
                  label: `ดูรายการบนหน้าจอ (${matched.length})`,
                  icon: '📋',
                  priority: 1,
                  keywords: ['รายการ', 'หน้าจอ', 'ดูบนหน้าจอ', 'ไม่ต้อง'],
                  handler: () => this.speak(`แสดง ${matched.length} ใบงาน ที่เกี่ยวกับ ${keyword} บนหน้าจอเรียบร้อยครับบอส`, false)
                }
              ]
            );
          } else {
            this.resetConversation();
            this.speak(`แสดง <b>${matched.length} ใบงาน</b> ที่เกี่ยวกับ ${keyword} บนหน้าจอเรียบร้อยครับบอส`, false);
          }
        }
      }

      executeMapRouting(items) {
        let url = "https://www.google.com/maps/dir/Current+Location/";
        items.slice(0, 9).forEach(item => {
          const cleanGps = item.gps.trim().replace(/\s/g, '');
          if (!cleanGps.toLowerCase().includes('http')) url += cleanGps + "/";
        });
        window.open(url, '_blank');
      }

      cleanText(text) {
        let kw = text
          .replace(/ช่วย|กรอง|หา|ค้นหา|ใบงาน|ที่อยู่|ในโซน|เอาเฉพาะ|เฉพาะ|เปิดดู|ดูงาน|ให้หน่อย|หน่อย|ครับ|ค่ะ|สิ/g, '')
          .replace(/กับ|และ|เว้นวรรค/g, ' ');
        const knownReasons = ["ช็อตไหม้", "น้ำเข้า", "ผ้ามัว", "ไม่หมุน", "ติดขัด", "ชำรุด", "ขั้วต่อ", "แป้นผุ"];
        knownReasons.forEach(reason => {
          if (kw.includes(reason)) kw = kw.replace(new RegExp(reason, 'g'), ' ' + reason + ' ');
        });
        return kw.replace(/\s+/g, ' ').trim();
      }
    }

    const jarvisBrain = new JarvisVoiceBrain();
    function toggleJarvis() {
      if (!isAdminUser) return;
      jarvisBrain.toggleListening();
    }
  </script>
</body>
